<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" width="1000" height="575" role="img" aria-labelledby="title desc"><title id="title">Same internal shape, different coordinate frame</title><desc id="desc">Synthetic tetrahedron · proper 90° rotation + translation · distances preserved</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d96aa"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8fc"/><text x="35" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#122e46" text-anchor="start" font-weight="700">Same internal shape, different coordinate frame</text><text x="35" y="75" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536f85" text-anchor="start" font-weight="400">Synthetic tetrahedron · proper 90° rotation + translation · distances preserved</text><path d="M265,330 L160,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M160,230 L160,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M160,230 L265,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M213,367 L160,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M213,367 L265,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M213,367 L160,230" fill="none" stroke="#759aac" stroke-width="3"/><circle cx="160" cy="330" r="10" fill="#147c9f"/><text x="176" y="320" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">0</text><circle cx="265" cy="330" r="10" fill="#147c9f"/><text x="281" y="320" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">1</text><circle cx="160" cy="230" r="10" fill="#147c9f"/><text x="176" y="220" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">2</text><circle cx="213" cy="367" r="10" fill="#147c9f"/><text x="229" y="357" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">3</text><text x="85" y="165" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#193b53" text-anchor="start" font-weight="700">Original coordinates</text><path d="M650,230 L650,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M545,330 L650,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M545,330 L650,230" fill="none" stroke="#759aac" stroke-width="3"/><path d="M703,367 L650,330" fill="none" stroke="#759aac" stroke-width="3"/><path d="M703,367 L650,230" fill="none" stroke="#759aac" stroke-width="3"/><path d="M703,367 L545,330" fill="none" stroke="#759aac" stroke-width="3"/><circle cx="650" cy="330" r="10" fill="#147c9f"/><text x="666" y="320" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">0</text><circle cx="650" cy="230" r="10" fill="#147c9f"/><text x="666" y="220" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">1</text><circle cx="545" cy="330" r="10" fill="#147c9f"/><text x="561" y="320" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">2</text><circle cx="703" cy="367" r="10" fill="#147c9f"/><text x="719" y="357" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="700">3</text><text x="575" y="165" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#193b53" text-anchor="start" font-weight="700">Rotated + translated</text><text x="40" y="450" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#193b53" text-anchor="start" font-weight="400">Right panel recenters the translated points for display; its orientation is changed.</text><text x="40" y="485" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#193b53" text-anchor="start" font-weight="400">Raw RMSD = 3.4641; undoing the known rigid transform gives RMSD = 0.</text><text x="40" y="520" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#193b53" text-anchor="start" font-weight="400">A distance-only comparison also permits reflections: chirality needs extra information.</text></svg>