<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="title desc"><title id="title">Scientific AI is a workflow, not one output</title><desc id="desc">Separate candidate generation from the independent check that gives it meaning.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d96aa"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8fc"/><text x="35" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#122e46" text-anchor="start" font-weight="700">Scientific AI is a workflow, not one output</text><text x="35" y="75" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536f85" text-anchor="start" font-weight="400">Separate candidate generation from the independent check that gives it meaning.</text><rect x="35" y="120" width="415" height="145" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="52" y="150" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Games and control</text><text x="52" y="177" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Input: observations and rules</text><text x="52" y="201" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Output: an action or policy</text><path d="M450,192 L530,192" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="120" width="425" height="145" rx="9" fill="#e8f4fa" stroke="#d4e0e9"/><text x="557" y="150" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Independent evaluation</text><text x="557" y="177" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Check: held-out play</text><text x="557" y="201" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">A score within a fixed environment</text><rect x="35" y="305" width="415" height="145" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="52" y="335" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Molecular prediction</text><text x="52" y="362" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Input: sequence and context</text><text x="52" y="386" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Output: coordinates + confidence</text><path d="M450,377 L530,377" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="305" width="425" height="145" rx="9" fill="#e8f4fa" stroke="#d4e0e9"/><text x="557" y="335" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Independent evaluation</text><text x="557" y="362" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Check: independent structures</text><text x="557" y="386" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Assess local errors and interfaces</text><rect x="35" y="490" width="415" height="145" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="52" y="520" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Algorithms and design</text><text x="52" y="547" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Input: specification + constraints</text><text x="52" y="571" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Output: a candidate construction</text><path d="M450,562 L530,562" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="490" width="425" height="145" rx="9" fill="#e8f4fa" stroke="#d4e0e9"/><text x="557" y="520" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Independent evaluation</text><text x="557" y="547" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Check: exact identity or mechanics</text><text x="557" y="571" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Then test relevance to the use case</text><text x="35" y="720" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#193b53" text-anchor="start" font-weight="400">Human decisions remain in the task definition, assumptions and verification protocol.</text></svg>