<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="570" viewBox="0 0 1150 570" role="img" aria-labelledby="title desc"><title id="title">Trim free body diagram with wing and tail force moment arms</title><desc id="desc">Side-view schematic shows weight at center of gravity, wing resultant, tail force, reference chord and signed moment arms without a curved moment arrow.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176b94"/></marker></defs><rect width="1150" height="570" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#17324d"><text x="38" y="43" font-size="30" font-weight="bold">Trim uses real forces and their signed lever arms about the CG</text><text x="38" y="74" font-size="18">Illustrative force lines and moment arms; not a performance or stability model</text><path d="M118 268 Q210 198 486 220 L755 252 L830 280 L755 307 L486 334 Q210 355 118 286Z" fill="#dce8ed" stroke="#17324d" stroke-width="4"/><path d="M335 324 L457 432 L535 424 L462 317Z" fill="#dce8ed" stroke="#17324d" stroke-width="4"/><path d="M664 239 L792 165 L828 177 L737 262Z" fill="#dce8ed" stroke="#17324d" stroke-width="4"/><path d="M734 302 L858 333 L842 352 L710 320Z" fill="#dce8ed" stroke="#17324d" stroke-width="4"/><circle cx="570" cy="282" r="10" fill="#c73338"/><text x="583" y="274" font-size="18">CG</text><g stroke="#176b94" stroke-width="4" marker-end="url(#a)"><path d="M430 408V245"/><path d="M782 390V318"/><path d="M570 285V470"/></g><text x="365" y="225" font-size="21">Wing resultant Lᵥ</text><text x="748" y="414" font-size="21">Tail force Lₜ</text><text x="587" y="467" font-size="21">Weight W</text><g stroke="#a85a1d" stroke-width="3" stroke-dasharray="8 6"><path d="M430 372H570"/><path d="M570 372H782"/></g><text x="464" y="365" font-size="21" fill="#a85a1d">dᵥ</text><text x="666" y="365" font-size="21" fill="#a85a1d">dₜ</text><text x="56" y="530" font-size="18">Moment balance about CG: each force contributes its force × signed perpendicular distance. The aerodynamic pitching couple M₀ may be included separately.</text></g></svg>
