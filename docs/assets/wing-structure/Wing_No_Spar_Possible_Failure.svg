6673,423.5668163023039 1167.3291913823327,423.56681630230383" fill="#197da6"/><path d="M1265,465.7287903272654 L1265,370.7287903272654" fill="none" stroke="#197da6" stroke-width="4" /><polygon points="1265,370.7287903272654 1272.6708086176673,384.77011131751135 1257.3291913823327,384.77011131751135" fill="#197da6"/><path d="M1355,421.64312938424507 L1355,326.64312938424507" fill="none" stroke="#197da6" stroke-width="4" /><polygon points="1355,326.64312938424507 1362.6708086176673,340.684450374491 1347.3291913823327,340.684450374491" fill="#197da6"/><path d="M1445,372.8406212235853 L1445,277.8406212235853" fill="none" stroke="#197da6" stroke-width="4" /><polygon points="1445,277.8406212235853 1452.6708086176673,291.8819422138313 1437.3291913823327,291.8819422138312" fill="#197da6"/><text x="1040" y="680" font-size="30" fill="#19364b">Upward lift load q(y)</text><text x="865" y="735" font-size="29" fill="#19364b">Root / attachment</text><text x="1340" y="735" font-size="29" fill="#19364b">Tip</text><text x="70" y="810" font-size="30" fill="#19364b">Spar caps carry major bending loads;</text><text x="70" y="853" font-size="30" fill="#19364b">the web carries shear in this architecture.</text><text x="850" y="810" font-size="30" fill="#19364b">Loads shift into the remaining skin / joints.</text><text x="850" y="853" font-size="30" fill="#19364b">Large bending or local failure may follow.</text><text x="70" y="908" font-size="28" fill="#19364b">Root bending moment is highest here; the actual first failure location depends on strength and details.</text><text x="55" y="995" font-size="28" fill="#19364b">Possible mechanisms only. Buckling is not necessarily fracture or final collapse.</text></g></svg>