<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Dimensions in a corrected top view of a semi-wing</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#167a91"/></marker></defs><rect width="1100" height="620" fill="#f6f8fb"/><style>text{font-family:Arial,sans-serif;fill:#19324b;font-size:20px}.title{font-size:28px;font-weight:bold}.small{font-size:17px}.label{font-weight:bold}.dim{stroke:#167a91;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style><text x="35" y="45" class="title">7A | Which distance is the software measuring?</text><text x="35" y="80" class="small">Corrected top view • Illustrative geometry and scale only</text><path d="M190 185 L880 260 L880 365 L190 445 Z" fill="#c8e5ed" stroke="#275b76" stroke-width="3"/><line x1="540" y1="223" x2="540" y2="405" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/><text x="350" y="310" class="label">Module seam</text><text x="170" y="155" class="">Root</text><text x="855" y="230" class="">Tip</text><line x1="190" y1="460" x2="190" y2="510" stroke="#64748b" stroke-width="2" /><line x1="880" y1="380" x2="880" y2="510" stroke="#64748b" stroke-width="2" /><line x1="195" y1="495" x2="875" y2="495" stroke="#64748b" stroke-width="2" class="dim"/><text x="355" y="532" class="label">Semi-span: root station to tip station</text><line x1="120" y1="185" x2="120" y2="445" stroke="#64748b" stroke-width="2" class="dim"/><line x1="120" y1="185" x2="180" y2="185" stroke="#64748b" stroke-width="2" /><line x1="120" y1="445" x2="180" y2="445" stroke="#64748b" stroke-width="2" /><text x="88" y="380" transform="rotate(-90 88 380)">Root chord</text><line x1="955" y1="260" x2="955" y2="365" stroke="#64748b" stroke-width="2" class="dim"/><line x1="890" y1="260" x2="955" y2="260" stroke="#64748b" stroke-width="2" /><line x1="890" y1="365" x2="955" y2="365" stroke="#6474