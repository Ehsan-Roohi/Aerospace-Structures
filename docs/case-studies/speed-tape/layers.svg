<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">A foil tape is a layered system</title><desc id="desc">Foil, adhesive, paint and structural substrate. Failure of the paint layer may lift the tape even if adhesive remains bonded.</desc><rect width="900" height="380" fill="#f4f8fb"/><g font-family="Arial,sans-serif" fill="#153047"><text x="30" y="40" font-size="25" font-weight="bold">A bond is only as sound as its load path</text><path d="M60 150H560L650 105" fill="none" stroke="#91a8b8" stroke-width="18"/><path d="M60 166H560L650 121" fill="none" stroke="#e2ae49" stroke-width="13"/><rect x="60" y="179" width="590" height="15" fill="#71b7bc"/><rect x="60" y="194" width="590" height="60" fill="#527895"/><g font-size="18"><text x="680" y="110">Soft foil backing</text><text x="680" y="143">PSA adhesive</text><text x="680" y="184">Paint / coating</text><text x="680" y="224">Substrate</text><text x="65" y="300">Edge separation can occur within a coating,</text><text x="65" y="328">not just between the tape and the surface.</text></g><path d="M550 180L606 157" stroke="#b52d46" stroke-width="4"/><circle cx="553" cy="179" r="27" fill="none" stroke="#b52d46" stroke-width="3"/></g></svg>
