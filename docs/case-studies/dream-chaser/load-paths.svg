<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
 <title id="title">One spaceplane, several different load paths</title><desc id="desc">An engineering map of the main load cases; not a Dream Chaser structural drawing.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#17788a"/></marker></defs>
 <rect width="1120" height="640" rx="16" fill="#eef5f8"/>
 <style>text{font-family:Arial,sans-serif;fill:#17394a}text[fill="white"]{fill:#fff}.title{font-size:30px;font-weight:bold}.sub{font-size:18px;fill:#496372}.label{font-size:22px;font-weight:bold}.small{font-size:18px}.box{fill:white;stroke:#b9cdd9;stroke-width:2}.arr{fill:none;stroke:#17788a;stroke-width:4;marker-end:url(#a)}</style>
 <text x="44" y="54" class="title">One spaceplane, several different load paths</text><text x="44" y="87" class="sub">An engineering map of the main load cases; not a Dream Chaser structural drawing.</text>
 <rect class="box" x="40" y="125" width="320" height="420" rx="12"/><rect class="box" x="400" y="125" width="320" height="420" rx="12"/><rect class="box" x="760" y="125" width="320" height="420" rx="12"/>
<text x="65" y="165" class="label">1 · Ascent</text><text x="65" y="214" class="small">Payload and vehicle inertia</text><path class="arr" d="M200 230V275"/>
<text x="65" y="310" class="small">Frames / pressure shell</text><path class="arr" d="M200 325V370"/><text x="65" y="405" class="small">Launch interface / adapter</text><text x="65" y="470" class="small">Acoustic pressure excites</text><text x="65" y="499" class="small">panels and attached equipment.</text>
<text x="425" y="165" class="label">2 · Orbit</text><text x="425" y="214" class="small">Cabin pressure difference</text><path class="arr" d="M560 230V275"/><text x="425" y="310" class="small">Skin membrane / joints</text><path class="arr" d="M560 325V370"/><text x="425" y="405" class="small">Frames around openings</text><text x="425" y="470" class="small">Thrusters add local forces</text><text x="425" y="499" class="small">and moments at their mounts.</text>
<text x="785" y="165" class="label">3 · Entry and landing</text><text x="785" y="214" class="small">Lift, drag and thermal gradients</text><path class="arr" d="M920 230V275"/><text x="785" y="310" class="small">Aeroshell / wings / hinges</text><path class="arr" d="M920 325V370"/><text x="785" y="405" class="small">Primary structure</text><text x="785" y="470" class="small">Touchdown: ground reactions</text><text x="785" y="499" class="small">enter through landing supports.</text>
 <text x="44" y="610" class="sub">MIE 446 · Original teaching schematic · Geometry and thicknesses are not to scale</text></svg>