 <text x="44" y="54" class="title">Heat protection and structural strength are different jobs</text><text x="44" y="87" class="sub">Generic layered TPS concept. Dream Chaser material families are discussed in the lesson.</text>
 <text x="68" y="145" class="label">Hot gas → surface heating</text><path class="arr" d="M290 162V210"/>
<rect x="68" y="225" width="640" height="58" fill="#bb653e"/><text x="90" y="262" fill="white" class="label">High-temperature surface / coating</text>
<rect x="68" y="283" width="640" height="110" fill="#f0dfb8"/><text x="90" y="332" class="label">Low-conductivity insulating base</text><text x="90" y="367" class="small">Slows transient heat penetration</text>
<rect x="68" y="393" width="640" height="42" fill="#97b6c6"/><text x="90" y="421" class="small">Attachment / strain accommodation</text>
<rect x="68" y="435" width="640" height="65" fill="#375f78"/><text x="90" y="475" fill="white" class="label">Load-carrying vehicle structure</text>
<text x="760" y="250" class="label">Check three quantities</text><text x="760" y="298" class="small">Surface temperature</text><text x="760" y="342" class="small">Bond-line temperature</text><text x="760" y="386" class="small">Structural temperature</text>
<text x="70" y="553" class="small">A hot outer tile does not imply an equally hot composite pressure shell.</text>
