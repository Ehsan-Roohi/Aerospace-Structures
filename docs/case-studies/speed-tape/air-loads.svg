<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">Aerodynamic loading on a surface patch</title><desc id="desc">Dynamic pressure is distinct from local normal pressure difference and tangential wall shear. A raised edge may begin peeling.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#145d88"/></marker><marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b12c78"/></marker></defs><rect width="900" height="400" fill="#f4f8fb"/><g font-family="Arial,sans-serif" fill="#153047"><text x="30" y="40" font-size="25" font-weight="bold">Speed alone is not the attachment load</text><path d="M65 110H795" stroke="#145d88" stroke-width="4" marker-end="url(#a)"/><text x="80" y="90" font-size="20">Free stream: density ρ, speed V</text><rect x="60" y="245" width="780" height="50" fill="#527895"/><path d="M225 215L285 235H710" fill="none" stroke="#91a8b8" stroke-width="12"/><path d="M290 242H710" stroke="#e2ae49" stroke-width="7"/><g stroke="#b12c78" stroke-width="3" marker-end="url(#p)"><path d="M360 225V160"/><path d="M470 225V160"/><path d="M580 225V160"/></g><path d="M620 215H735" stroke="#145d88" stroke-width="3" marker-end="url(#a)"/><g font-size="19"><text x="335" y="145">Normal pressure difference Δp</text><text x="640" y="198">Wall shear</text><text x="65" y="345">Raised edge → local opening and possible peel</text></g><path d="M245 320L235 225" stroke="#b12c78" stroke-width="2" marker-end="url(#p)"/></g></svg>
