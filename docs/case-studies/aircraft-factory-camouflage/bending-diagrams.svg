<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Read the force and moment diagrams together</title><desc id="d">Uniform downward loading on a simply supported beam.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b46e36"/></marker></defs><rect width="1000" height="560" fill="#f4f5f1"/><g font-family="Arial, sans-serif" fill="#1d3845"><text x="42" y="53" font-size="28" font-weight="700">Read the force and moment diagrams together</text><text x="42" y="88" font-size="17" fill="#536a72">Uniform downward loading on a simply supported beam.</text><path d="M160 155H850" stroke="#24424f" stroke-width="7"/><path d="M160 210H850M160 365H850" stroke="#9aaeb3" stroke-width="2"/><path d="M160 220L850 300L850 260H160Z" fill="#d1ddd1"/><path d="M160 260L850 260M160 220L850 300" fill="none" stroke="#50704f" stroke-width="3"/><path d="M160 365Q505 495 850 365" fill="#dfc7b3" stroke="#b46e36" stroke-width="4"/><text x="70" y="265" font-size="25">V</text><text x="70" y="400" font-size="25">M</text><text x="390" y="200" font-size="20">V(x) = wL/2 − wx</text><text x="400" y="480" font-size="20">M(x) = wx(L − x)/2</text><text x="400" y="125" font-size="20">Mmax occurs where V = 0</text></g><text x="42" y="535" fill="#63777a" font-family="Arial,sans-serif" font-size="15">Original teaching diagram · conceptual geometry, not a reconstruction of Plant 2</text></svg>