<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Repair scope follows damage assessment</title><desc id="desc">Aircraft-specific damage assessment and repair data determine whether cosmetic treatment or a designed structural repair is appropriate. Catalogue properties alone authorize neither.</desc><rect width="900" height="440" fill="#f4f8fb"/><g font-family="Arial,sans-serif" fill="#153047"><text x="30" y="40" font-size="25" font-weight="bold">Protecting a surface ≠ restoring a structural load path</text><rect x="160" y="75" width="580" height="70" rx="10" fill="#dceaf3" stroke="#145d88"/><text x="450" y="105" text-anchor="middle" font-size="21">Aircraft-specific damage assessment</text><text x="450" y="131" text-anchor="middle" font-size="18">Applicable maintenance / repair data</text><path d="M450 145V178H230V205M450 178H670V205" stroke="#145d88" stroke-width="3" fill="none"/><rect x="45" y="205" width="370" height="120" rx="10" fill="#e7f3ee" stroke="#257355"/><rect x="485" y="205" width="370" height="120" rx="10" fill="#fff3dc" stroke="#a27623"/><g text-anchor="middle"><text x="230" y="238" font-size="21" font-weight="bold">Assessed non-structural damage</text><text x="230" y="271" font-size="18">A permitted temporary surface</text><text x="230" y="297" font-size="18">treatment may be available</text><text x="670" y="238" font-size="21" font-weight="bold">Structural repair needed</text><text x="670" y="271" font-size="18">Designed load transfer, processing,</text><text x="670" y="297" font-size="18">inspection and authorization</text><text x="450" y="378" font-size="20">Tape appearance or a product data sheet alone does not authorize flight.</text><text x="450" y="410" font-size="17">Conceptual distinction only — not a maintenance decision procedure.</text></g></g></svg>
