<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title"><title id="title">Low mass helps gravity loads; anchors must still resist uplift</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#bd4e30"/></marker></defs><rect width="1000" height="480" rx="20" fill="#f2f5f2"/><g font-family="system-ui,Arial" fill="#183d40"><text x="40" y="50" font-size="27" font-weight="bold">Low mass helps gravity loads; anchors must still resist uplift</text><rect x="170" y="215" width="630" height="20" fill="#557e68"/><path d="M210 240V380M750 240V380M150 380H820" stroke="#183d40" stroke-width="8"/><g stroke="#bd4e30" stroke-width="5" marker-end="url(#a)"><path d="M260 200V110M420 200V110M580 200V110M740 200V110"/></g><text x="220" y="90" font-size="24">net uplift pressure: p</text><text x="310" y="290" font-size="23">F = p A</text><text x="310" y="330" font-size="21">connections transfer load into the existing roof</text><text x="235" y="412" font-size="21">porous fabric ≠ automatically zero wind load</text></g><text x="40" y="455" font-family="system-ui,Arial" font-size="17" fill="#456064">Original teaching schematic · conceptual, not a surveyed Plant 2 drawing</text></svg>