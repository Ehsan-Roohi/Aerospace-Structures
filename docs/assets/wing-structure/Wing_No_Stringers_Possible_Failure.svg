<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><title>3  Removing a stringer widens a thin compression panel</title><desc>Original educational schematic. Members removed from an existing conventional wing without redesign. Deformations exaggerated; no failure load or crack location is predicted.</desc><rect width="1600" height="1060" fill="white"/><g font-family="Arial,sans-serif"><text x="55" y="65" font-size="42" fill="#19364b">3  Removing a stringer widens a thin compression panel</text><text x="55" y="112" font-size="29" fill="#19364b">Same external load; remaining structure is NOT redesigned.</text><text x="70" y="190" font-size="35" fill="#19364b">A  Skin with stringers</text><text x="850" y="190" font-size="35" fill="#19364b">B  One stringer removed</text><rect x="120" y="330" width="540" height="280" fill="#e2edf2" stroke="#19364b" stroke-width="3"/><path d="M120,325 L120,615" fill="none" stroke="#b76b26" stroke-width="10" /><path d="M660,325 L660,615" fill="none" stroke="#b76b26" stroke-width="10" /><path d="M120,330 L660,330" fill="none" stroke="#397853" stroke-width="9" /><path d="M120,470 L660,470" fill="none" stroke="#397853" stroke-width="9" /><path d="M120,610 L660,610" fill="none" stroke="#397853" stroke-width="9" /><path d="M55,400 L108,400" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="108,400 93.95867900975404,407.67080861766726 93.95867900975404,392.32919138233274" fill="#b42b37"/><path d="M725,400 L672,400" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="672,400 686.0413209902459,392.32919138233274 686.0413209902459,407.67080861766726" fill="#b42b37"/><path d="M55,540 L108,540" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="108,540 93.95867900975404,547.6708086176673 93.95867900975404,532.3291913823327" fill="#b42b37"/><path d="M725,540 L672,540" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="672,540 686.0413209902459,532.3291913823327 686.0413209902459,547.6708086176673" fill="#b42b37"/><text x="170" y="272" font-size="29" fill="#b42b37">Spanwise compression</text><path d="M695,330 L695,470" fill="none" stroke="#19364b" stroke-width="3" /><path d="M687,322 L703,338" fill="none" stroke="#19364b" stroke-width="3" /><path d="M687,462 L703,478" fill="none" stroke="#19364b" stroke-width="3" /><text x="704" y="450" font-size="30" fill="#19364b">b</text><text x="150" y="683" font-size="27" fill="#19364b">Brown: ribs at ends of the panel</text><text x="150" y="727" font-size="27" fill="#19364b">Green: skin-attached stringers</text><rect x="910" y="330" width="540" height="280" fill="#e2edf2" stroke="#19364b" stroke-width="3"/><path d="M910,325 L910,615" fill="none" stroke="#b76b26" stroke-width="10" /><path d="M1450,325 L1450,615" fill="none" stroke="#b76b26" stroke-width="10" /><path d="M910,330 L1450,330" fill="none" stroke="#397853" stroke-width="9" /><path d="M910,470 L1450,470" fill="none" stroke="#82939d" stroke-width="3" stroke-dasharray="10 8"/><path d="M910,610 L1450,610" fill="none" stroke="#397853" stroke-width="9" /><path d="M845,400 L898,400" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="898,400 883.9586790097541,407.67080861766726 883.9586790097541,392.32919138233274" fill="#b42b37"/><path d="M1515,400 L1462,400" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="1462,400 1476.041320990246,392.32919138233274 1476.041320990246,407.67080861766726" fill="#b42b37"/><path d="M845,540 L898,540" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="898,540 883.9586790097541,547.6708086176673 883.9586790097541,532.3291913823327" fill="#b42b37"/><path d="M1515,540 L1462,540" fill="none" stroke="#b42b37" stroke-width="4" /><polygon points="1462,540 1476.041320990246,532.3291913823327 1476.041320990246,547.6708086176673" fill="#b42b37"/><text x="960" y="272" font-size="29" fill="#b42b37">Spanwise compression</text><path d="M995,335 Q960,400 995,470 Q1030,545 995,605" fill="none" stroke="#b42b37" stroke-width="3"/><path d="M1080,335 Q1045,400 1080,470 Q1115,545 1080,605" fill="none" stroke="#b42b37" stroke-width="3"/><path d="M1165,335 Q1130,400 1165,470 Q1200,545 1165,605" fill="none" stroke="#b42b37" stroke-width="3"/><path d="M1250,335 Q1215,400 1250,470 Q1285,545 1250,605" fill="none" stroke="#b42b37" stroke-width="3"/><path d="M1335,335 Q1300,400 1335,470 Q1370,545 1335,605" fill="none" stroke="#b42b37" stroke-width="3"/><path d="M1485,330 L1485,610" fill="none" stroke="#19364b" stroke-width="3" /><path d="M1477,322 L1493,338" fill="none" stroke="#19364b" stroke-width="3" /><path d="M1477,602 L1493,618" fill="none" stroke="#19364b" stroke-width="3" /><text x="1494" y="480" font-size="30" fill="#19364b">2b</text><text x="940" y="683" font-size="27" fill="#19364b">Brown: ribs at ends of the panel</text><text x="940" y="727" font-size="27" fill="#19364b">Green: skin-attached stringers</text><text x="75" y="805" font-size="30" fill="#19364b">Narrow skin panels resist local buckling;</text><text x="75" y="848" font-size="30" fill="#19364b">stringers also share longitudinal load.</text><text x="850" y="805" font-size="30" fill="#19364b">Wider thin-skin panel may wrinkle earlier.</text><text x="850" y="848" font-size="30" fill="#19364b">Failure is not necessarily a broken spar.</text><text x="70" y="925" font-size="28" fill="#19364b">Flat-plate idealization: buckling stress scales with (t / b)² when the buckling coefficient is unchanged.</text><text x="70" y="970" font-size="28" fill="#19364b">Here b is chordwise panel width, NOT spanwise rib spacing. Red waves are illustrative.</text><text x="55" y="1015" font-size="28" fill="#19364b">Possible mechanisms only. Buckling is not necessarily fracture or final collapse.</text></g></svg>