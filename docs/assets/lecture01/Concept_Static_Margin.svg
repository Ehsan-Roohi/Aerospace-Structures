<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Static margin compared for forward, neutral and aft center of gravity</title><desc id="desc">Three side view aircraft schematics show CG forward of, equal to and aft of neutral point, with moment response after a small increase in angle of attack.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176b94"/></marker></defs><rect width="1200" height="650" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#17324d"><text x="38" y="43" font-size="30" font-weight="bold">Static margin predicts the initial pitch response to a small disturbance</text><text x="38" y="74" font-size="18">Controls fixed · attached flow · conventional sign convention: nose-up Cₘ is positive</text><g transform="translate(35 125)"><rect width="350" height="410" rx="14" fill="#f5f8fa" stroke="#9db2bf" stroke-width="2"/><text x="20" y="38" font-size="23" font-weight="bold">CG ahead of NP</text><text x="20" y="68" font-size="19" fill="#257f4b">SM &gt; 0: statically stable</text><path d="M38 222 Q95 172 225 185 L300 210 L225 235 Q95 250 38 230Z" fill="#dce8ed" stroke="#17324d" stroke-width="3"/><path d="M120 235 L170 300 L215 295 L180 230Z" fill="#dce8ed" stroke="#17324d" stroke-width="3"/><circle cx="150" cy="212" r="9" fill="#c73338"/><circle cx="205" cy="212" r="9" fill="#6b7680"/><text x="130" y="192" font-size="16">CG</text><text x="191" y="192" font-size="16">NP</text><path d="M235 344 A60 60 0 0 1 170 354" fill="none" stroke="#176b94" stroke-width="4" marker-end="url(#a)"/><text x="43" y="333" font-size="18">Small α ↑ → nose-down ΔM</text><text x="20" y="385" font-size="18">Cₘα &lt; 0</text></g><g transform="translate(425 125)"><rect width="350" height="410" rx="14" fill="#f5f8fa" stroke="#9db2bf" stroke-width="2"/><text x="20" y="38" font-size="23" font-weight="bold">CG at NP</text><text x="20" y="68" font-size="19" fill="#8d651b">SM = 0: neutral</text><path d="M38 222 Q95 172 225 185 L300 210 L225 235 Q95 250 38 230Z" fill="#dce8ed" stroke="#17324d" stroke-width="3"/><path d="M120 235 L170 300 L215 295 L180 230Z" fill="#dce8ed" stroke="#17324d" stroke-width="3"/><circle cx="185" cy="212" r="10" fill="#804c9d"/><text x="166" y="192" font-size="16">CG = NP</text><text x="20" y="333" font-size="18">Small α ↑ → ΔM ≈ 0</text><text x="20" y="385" font-size="18">Cₘα ≈ 0</text></g><g transform="translate(815 125)"><rect width="350" height="410" rx="14" fill="#f5f8fa" stroke="#9db2bf" stroke-width="2"/><text x="20" y="38" font-size="23" font-weight="bold">CG aft of NP</text><text x="20" y="68" font-size="19" fill="#c73338">SM &lt; 0: statically unstable</text><path d="M38 222 Q95 172 225 185 L300 210 L225 235 Q95 250 38 230Z" fill="#dce8ed" stroke="#17324d" stroke-width="3"/><path d="M120 235 L170 300 L215 295 L180 230Z" fill="#dce8ed" stroke="#17324d" stroke-width="3"/><circle cx="246" cy="212" r="9" fill="#c73338"/><circle cx="205" cy="212" r="9" fill="#6b7680"/><text x="231" y="192" font-size="16">CG</text><text x="191" y="192" font-size="16">NP</text><path d="M165 344 A60 60 0 0 0 230 354" fill="none" stroke="#c73338" stroke-width="4" marker-end="url(#a)"/><text x="20" y="333" font-size="18">Small α ↑ → nose-up ΔM</text><text x="20" y="385" font-size="18">Cₘα &gt; 0</text></g><text x="38" y="585" font-size="19">SM = (xNP − xCG) / c̄. Positive static margin helps restore angle of attack, but its adequate range depends on configuration, control authority and dynamic behavior.</text></g></svg>
