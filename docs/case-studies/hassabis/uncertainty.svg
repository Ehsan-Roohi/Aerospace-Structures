<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="title desc"><title id="title">Which input dominates the uncertainty budget?</title><desc id="desc">First-order independent small uncertainties · analytical cantilever example</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d96aa"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8fc"/><text x="35" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#122e46" text-anchor="start" font-weight="700">Which input dominates the uncertainty budget?</text><text x="35" y="75" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536f85" text-anchor="start" font-weight="400">First-order independent small uncertainties · analytical cantilever example</text><text x="35" y="158" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="400">Force</text><rect x="180" y="135" width="95.04950495049505" height="34" rx="3" fill="#237c9f" stroke="none"/><text x="290.049504950495" y="158" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#193b53" text-anchor="start" font-weight="400">15.8% of total variance</text><text x="35" y="223" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="400">Length</text><rect x="180" y="200" width="53.46534653465346" height="34" rx="3" fill="#237c9f" stroke="none"/><text x="248.46534653465346" y="223" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#193b53" text-anchor="start" font-weight="400">8.9% of total variance</text><text x="35" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="400">Modulus</text><rect x="180" y="265" width="213.86138613861385" height="34" rx="3" fill="#237c9f" stroke="none"/><text x="408.86138613861385" y="