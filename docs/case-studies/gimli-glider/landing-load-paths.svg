<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" role="img" aria-labelledby="title desc">
  <title id="title">Simplified landing load paths before and after nose gear collapse</title><desc id="desc">Two aircraft side-view schematics compare normal main-gear load transfer with the abnormal fuselage contact load path after nose gear collapse.</desc>
  <defs><style>.bg{fill:#f7f8fa}.body{fill:#e9e3ed;stroke:#4c2a58;stroke-width:4}.wing{fill:#d5c5dd;stroke:#4c2a58;stroke-width:3}.gear{stroke:#27232a;stroke-width:8}.run{stroke:#555;stroke-width:12}.load{stroke:#a62020;stroke-width:6;marker-end:url(#r)}.react{stroke:#267348;stroke-width:6;marker-end:url(#g)}.head{font:700 28px Arial,sans-serif;fill:#24132b}.t{font:20px Arial,sans-serif;fill:#3c3340}</style><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#a62020"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#267348"/></marker></defs>
  <rect class="bg" width="1300" height="660" rx="20"/><text x="650" y="46" text-anchor="middle" class="head">Touchdown changed the structural load path</text>
  <text x="330" y="95" text-anchor="middle" class="head">Main-gear touchdown</text><path class="run" d="M40 360H620"/><path class="body" d="M90 265 Q150 210 440 220 Q535 230 580 280 Q500 300 155 300 Q105 295 90 265Z"/><path class="wing" d="M270 244L455 125L505 145L365 260Z"/><path class="gear" d="M335 290L315 350M420 290L440 350"/><circle cx="312" cy="354" r="15" fill="#222"/><circle cx="443" cy="354" r="15" fill="#222"/><path class="load" d="M360 115V205"/><text x="375" y="140" class="t">Weight + inertia</text><path class="react" d="M315 350V270"/><path class="react" d="M440 350V270"/><text x="220" y="405" class="t">Gear reactions enter reinforced attachment structure</text>
  <text x="970" y="95" text-anchor="middle" class="head">After nose-gear collapse</text><path class="run" d="M680 440H1260"/><g transform="translate(650 110) rotate(5 320 220)"><path class="body" d="M90 265 Q150 210 440 220 Q535 230 580 280 Q500 300 155 300 Q105 295 90 265Z"/><path class="wing" d="M270 244L455 125L505 145L365 260Z"/><path class="gear" d="M335 290L315 350M420 290L440 350"/><circle cx="312" cy="354" r="15" fill="#222"/><circle cx="443" cy="354" r="15" fill="#222"/></g><path class="load" d="M1030 155V245"/><text x="1045" y="180" class="t">Weight + inertia</text><path class="react" d="M760 438V350"/><text x="690" y="500" class="t">Nose/fuselage contact: concentrated force, abrasion, friction</text><path class="react" d="M980 438V350"/><path class="react" d="M1105 438V350"/><text x="820" y="555" class="t">Main gear still transfers vertical and braking loads</text>
  <text x="650" y="620" text-anchor="middle" class="t">Local damage is survivable when primary cabin load paths and occupied volume remain intact.</text>
</svg>
