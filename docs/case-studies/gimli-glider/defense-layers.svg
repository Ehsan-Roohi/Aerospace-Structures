<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc">
  <title id="title">Multiple defenses that failed before Flight 143 ran out of fuel</title><desc id="desc">Seven barrier panels show equipment redundancy, dispatch rules, maintenance records, training, assigned responsibility, units, and independent verification.</desc>
  <defs><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#69337c;stroke-width:3}.x{font:700 38px Arial,sans-serif;fill:#a62020}.t{font:700 21px Arial,sans-serif;fill:#25152c}.s{font:18px Arial,sans-serif;fill:#413746}.head{font:700 30px Arial,sans-serif;fill:#25152c}</style></defs>
  <rect class="bg" width="1300" height="650" rx="20"/><text x="650" y="50" text-anchor="middle" class="head">The error passed through several nominal defenses</text>
  <g transform="translate(35 100)"><rect class="b" width="160" height="390" rx="18"/><text x="80" y="58" text-anchor="middle" class="x">×</text><text x="80" y="110" text-anchor="middle" class="t"><tspan x="80">FQIS</tspan><tspan x="80" dy="27">redundancy</tspan></text><text x="80" y="200" text-anchor="middle" class="s"><tspan x="80">Two channels</tspan><tspan x="80" dy="25">did not leave</tspan><tspan x="80" dy="25">a usable</tspan><tspan x="80" dy="25">display</tspan></text></g>
  <g transform="translate(215 100)"><rect class="b" width="160" height="390" rx="18"/><text x="80" y="58" text-anchor="middle" class="x">×</text><text x="80" y="110" text-anchor="middle" class="t"><tspan x="80">Dispatch</tspan><tspan x="80" dy="27">rule</tspan></text><text x="80" y="200" text-anchor="middle" class="s"><tspan x="80">Blank gauges</tspan><tspan x="80" dy="25">should have</tspan><tspan x="80" dy="25">kept the</tspan><tspan x="80" dy="25">aircraft down</tspan></text></g>
  <g transform="translate(395 100)"><rect class="b" width="160" height="390" rx="18"/><text x="80" y="58" text-anchor="middle" class="x">×</text><text x="80" y="110" text-anchor="middle" class="t"><tspan x="80">Maintenance</tspan><tspan x="80" dy="27">record</tspan></text><text x="80" y="200" text-anchor="middle" class="s"><tspan x="80">Tag and log</tspan><tspan x="80" dy="25">did not clearly</tspan><tspan x="80" dy="25">describe system</tspan><tspan x="80" dy="25">state</tspan></text></g>
  <g transform="translate(575 100)"><rect class="b" width="160" height="390" rx="18"/><text x="80" y="58" text-anchor="middle" class="x">×</text><text x="80" y="110" text-anchor="middle" class="t"><tspan x="80">Training</tspan></text><text x="80" y="200" text-anchor="middle" class="s"><tspan x="80">No dedicated</tspan><tspan x="80" dy="25">fuel-conversion</tspan><tspan x="80" dy="25">training for</tspan><tspan x="80" dy="25">this task</tspan></text></g>
  <g transform="translate(755 100)"><rect class="b" width="160" height="390" rx="18"/><text x="80" y="58" text-anchor="middle" class="x">×</text><text x="80" y="110" text-anchor="middle" class="t"><tspan x="80">Ownership</tspan></text><text x="80" y="200" text-anchor="middle" class="s"><tspan x="80">Responsibility</tspan><tspan x="80" dy="25">for the manual</tspan><tspan x="80" dy="25">calculation was</tspan><tspan x="80" dy="25">unclear</tspan></text></g>
  <g transform="translate(935 100)"><rect class="b" width="160" height="390" rx="18"/><text x="80" y="58" text-anchor="middle" class="x">×</text><text x="80" y="110" text-anchor="middle" class="t"><tspan x="80">Unit label</tspan></text><text x="80" y="200" text-anchor="middle" class="s"><tspan x="80">1.77 was</tspan><tspan x="80" dy="25">given without</tspan><tspan x="80" dy="25">a clear unit</tspan><tspan x="80" dy="25">meaning</tspan></text></g>
  <g transform="translate(1115 100)"><rect class="b" width="150" height="390" rx="18"/><text x="75" y="58" text-anchor="middle" class="x">×</text><text x="75" y="110" text-anchor="middle" class="t"><tspan x="75">Independent</tspan><tspan x="75" dy="27">check</tspan></text><text x="75" y="200" text-anchor="middle" class="s"><tspan x="75">Ottawa repeated</tspan><tspan x="75" dy="25">the same unit</tspan><tspan x="75" dy="25">assumption and</tspan><tspan x="75" dy="25">confirmed it</tspan></text></g>
  <text x="650" y="555" text-anchor="middle" class="head">A repeated calculation is not independent if it repeats the same assumption.</text>
</svg>
