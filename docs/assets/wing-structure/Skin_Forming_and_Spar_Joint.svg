<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180"><title>Rolled sheet + shaped panels + riveted connections</title><rect width="1800" height="1180" fill="white"/><g font-family="Arial, sans-serif"><text x="60" y="70" font-size="43" fill="#19364b">Rolled sheet + shaped panels + riveted connections</text><text x="60" y="125" font-size="29" fill="#19364b">Shape the sheet, then fasten it to the structure. Thicknesses enlarged for clarity.</text><text x="70" y="230" font-size="33" fill="#19364b">A  Rolled alloy sheet</text><text x="680" y="230" font-size="33" fill="#19364b">B  Form to wing contour</text><polygon points="100,345 440,345 545,280 205,280" fill="#b9ccd6" fill-opacity="1" stroke="#19364b" stroke-width="3"/><text x="70" y="435" font-size="29" fill="#19364b">Cut panels to the required size.</text><path d="M680,370 Q835,235 1035,340" fill="none" stroke="#19364b" stroke-width="18"/><path d="M680,370 Q835,235 1035,340" fill="none" stroke="#b9ccd6" stroke-width="12"/><path d="M565,335 L630,335" fill="none" stroke="#19364b" stroke-width="3" /><polygon points="630,335 605,322 605,348" fill="#19364b" fill-opacity="1" stroke="#19364b" stroke-width="3"/><text x="680" y="435" font-size="29" fill="#19364b">Bend / roll / form as required.</text><text x="70" y="535" font-size="33" fill="#19364b">C  Section through a riveted skin-to-spar joint</text><rect x="330" y="650" width="730" height="23" fill="#b9ccd6" stroke="#19364b" stroke-width="3"/><polygon points="450,673 940,673 940,715 716,715 716,935 674,935 674,715 450,715" fill="#197da6" fill-opacity="1" stroke="#19364b" stroke-width="3"/><rect x="531" y="650" width="18" height="67" fill="#b45524" stroke="#19364b" stroke-width="3"/><polygon points="514,650 531,636 549,636 566,650" fill="#b45524" fill-opacity="1" stroke="#19364b" stroke-width="3"/><ellipse cx="540" cy="721" rx="24" ry="10" fill="#b45524"/><rect x="841" y="650" width="18" height="67" fill="#b45524" stroke="#19364b" stroke-width="3"/><polygon points="824,650 841,636 859,636 876,650" fill="#b45524" fill-opacity="1" stroke="#19364b" stroke-width="3"/><ellipse cx="850" cy="721" rx="24" ry="10" fill="#b45524"/><rect x="716" y="792" width="18" height="238" fill="#edf4f7" stroke="#19364b" stroke-width="3"/><circle cx="705" cy="830" r="11" fill="#b45524"/><circle cx="705" cy="895" r="11" fill="#b45524"/><text x="1180" y="670" font-size="31" fill="#19364b">Metal skin</text><path d="M1160,665 L1030,663" fill="none" stroke="#19364b" stroke-width="3" /><text x="1180" y="745" font-size="31" fill="#19364b">Extruded spar cap</text><path d="M1160,740 L925,691" fill="none" stroke="#19364b" stroke-width="3" /><text x="1180" y="865" font-size="31" fill="#19364b">Separate sheet web</text><path d="M1160,860 L734,950" fill="none" stroke="#19364b" stroke-width="3" /><text x="80" y="845" font-size="31" fill="#19364b">Rivet</text><path d="M190,838 L538,695" fill="none" stroke="#19364b" stroke-width="3" /><text x="80" y="945" font-size="29" fill="#19364b">Outside surface</text><path d="M290,930 L375,650" fill="none" stroke="#19364b" stroke-width="3" /><text x="60" y="1110" font-size="28" fill="#19364b">The skin is structural: it carries local pressure and participates in wing loads, including torsion.</text></g></svg>