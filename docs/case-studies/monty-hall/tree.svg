<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc"><title id="title">One placement, then one host action</title><desc id="desc">Read terminal probability masses before conditioning on a named opening.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d96aa"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8fc"/><text x="35" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#122e46" text-anchor="start" font-weight="700">One placement, then one host action</text><text x="35" y="75" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536f85" text-anchor="start" font-weight="400">Read terminal probability masses before conditioning on a named opening.</text><rect x="35" y="275" width="200" height="115" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="52" y="305" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Player chooses 1</text><text x="52" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Prize uniformly placed</text><text x="52" y="356" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Host knows the prize</text><path d="M235,332 L330,162" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="120" width="215" height="85" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="347" y="150" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Prize: door 1</text><text x="347" y="177" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Probability 1/3</text><path d="M235,332 L330,347" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="305" width="215" height="85" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="347" y="335" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Prize: door 2</text><text x="347" y="362" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Probability 1/3</text><path d="M235,332 L330,532" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="490" width="215" height="85" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="347" y="520" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Prize: door 3</text><text x="347" y="547" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Probability 1/3</text><path d="M545,162 L655,150" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="110" width="300" height="90" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="672" y="140" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#8b6325" text-anchor="start" font-weight="700">Host opens 2</text><text x="672" y="167" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#8b6325" text-anchor="start" font-weight="400">Mass = 1/6 · STAY wins</text><path d="M545,162 L655,260" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="220" width="300" height="90" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="672" y="250" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#8b6325" text-anchor="start" font-weight="700">Host opens 3</text><text x="672" y="277" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#8b6325" text-anchor="start" font-weight="400">Mass = 1/6 · STAY wins</text><path d="M545,347 L655,390" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="350" width="300" height="90" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="672" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#116d86" text-anchor="start" font-weight="700">Host opens 3</text><text x="672" y="407" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#116d86" text-anchor="start" font-weight="400">Mass = 1/3 · SWITCH wins</text><path d="M545,532 L655,545" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="505" width="300" height="90" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="672" y="535" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#116d86" text-anchor="start" font-weight="700">Host opens 2</text><text x="672" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#116d86" text-anchor="start" font-weight="400">Mass = 1/3 · SWITCH wins</text><text x="35" y="625" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#193b53" text-anchor="start" font-weight="400">Condition on H3: retain masses 1/6 and 1/3; normalize by their sum, 1/2.</text></svg>