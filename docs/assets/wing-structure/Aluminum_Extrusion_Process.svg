<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img"><title>Extrusion makes a long profile — not a complete wing</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#19364b"/></marker></defs><rect width="1800" height="1100" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="70" font-size="43" text-anchor="start" fill="#19364b">Extrusion makes a long profile — not a complete wing</text><text x="65" y="120" font-size="29" text-anchor="start" fill="#19364b">Hot solid metal flows through a shaped die under pressure — it is not poured through as a melt.</text><text x="65" y="205" font-size="32" text-anchor="start" fill="#19364b">1  Heat the solid billet</text><text x="700" y="205" font-size="32" text-anchor="start" fill="#19364b">2  Push through the die</text><text x="1270" y="205" font-size="32" text-anchor="start" fill="#19364b">3  Long constant section</text><rect x="410" y="315" width="570" height="260" fill="#f3f7f9" stroke="#a4b8c5" stroke-width="3"/><rect x="455" y="350" width="490" height="190" fill="#eac3a0" stroke="#19364b" stroke-width="3"/><rect x="160" y="400" width="295" height="90" fill="#adbcc6" stroke="#19364b" stroke-width="3"/><path d="M185,365 L425,365" fill="none" stroke="#19364b" stroke-width="4" marker-end="url(#arrow)"/><rect x="978" y="310" width="60" height="270" fill="#19364b" stroke="#19364b" stroke-width="3"/><polygon points="1038,345 1258,345 1708,405 1488,405" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><polygon points="1038,345 1488,405 1488,437 1038,377" fill="#17749d" stroke="#19364b" stroke-width="3"/><polygon points="1130,377 1148,377 1598,437 1580,437" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><polygon points="1130,377 1580,437 1580,547 1130,487" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><polygon points="1488,405 1708,405 1708,437 1598,437 1598,547 1580,547 1580,437 1488,437" fill="#17749d" stroke="#19364b" stroke-width="3"/><text x="190" y="590" font-size="30" text-anchor="start" fill="#19364b">Ram</text><path d="M240,565 L280,492" fill="none" stroke="#19364b" stroke-width="4" /><text x="520" y="590" font-size="30" text-anchor="start" fill="#19364b">Hot solid billet</text><path d="M715,565 L710,541" fill="none" stroke="#19364b" stroke-width="4" /><text x="930" y="643" font-size="30" text-anchor="start" fill="#19364b">Steel die</text><path d="M1000,615 L1008,578" fill="none" stroke="#19364b" stroke-width="4" /><text x="1360" y="625" font-size="30" text-anchor="start" fill="#19364b">Extruded T profile</text><path d="M1540,597 L1589,536" fill="none" stroke="#19364b" stroke-width="4" /><text x="80" y="710" font-size="30" text-anchor="start" fill="#19364b">Die viewed from the front</text><rect x="140" y="750" width="250" height="205" fill="#adbcc6" stroke="#19364b" stroke-width="3"/><polygon points="185,790 345,790 345,825 282,825 282,915 248,915 248,825 185,825" fill="white" stroke="#19364b" stroke-width="3"/><text x="450" y="808" font-size="31" text-anchor="start" fill="#19364b">T-shaped opening</text><path d="M435,820 L345,810" fill="none" stroke="#19364b" stroke-width="4" /><text x="450" y="858" font-size="29" text-anchor="start" fill="#19364b">The opening sets the cross-section.</text><text x="450" y="909" font-size="28" text-anchor="start" fill="#19364b">Cooling, heat treatment, straightening and machining follow.</text><text x="65" y="1010" font-size="28" text-anchor="start" fill="#19364b">Historical advance: Sumitomo installed a 2,000-ton extrusion press in 1935.</text><text x="65" y="1055" font-size="26" text-anchor="start" fill="#19364b">Schematic process only; no alloy-specific temperature or shop procedure is prescribed.</text></g></svg>