<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b42318"/></marker><style>text{font-family:Arial,sans-serif;fill:#172b4d}.t{font-size:30px;font-weight:bold}.s{font-size:21px}.p{fill:#edf6fa;stroke:#496b86;stroke-width:3}.f{stroke:#b42318;stroke-width:5;marker-end:url(#a)}.l{stroke:#1f7a4c;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1300" height="560" fill="white"/><text x="650" y="43" text-anchor="middle" class="t">CG position changes the tail force needed for trim</text>
<g transform="translate(20 75)"><rect width="400" height="430" rx="18" class="p"/><text x="200" y="38" text-anchor="middle" class="t">CG forward</text><path d="M45 235 Q160 170 285 225 L365 185 335 235 380 260 270 265 Q150 300 45 235Z" fill="#b9d8e7"/><circle cx="155" cy="245" r="18" fill="#f9a825"/><text x="155" y="250" text-anchor="middle">CG</text><line x1="220" y1="260" x2="220" y2="120" class="l"/><text x="230" y="120" class="s">Wing lift</text><line x1="325" y1="215" x2="325" y2="350" class="f"/><text x="200" y="390" text-anchor="middle" class="s">More nose-up control may be needed</text></g>
<g transform="translate(450 75)"><rect width="400" height="430" rx="18" class="p"/><text x="200" y="38" text-anchor="middle" class="t">Within envelope</text><path d="M45 235 Q160 170 285 225 L365 185 335 235 380 260 270 265 Q150 300 45 235Z" fill="#b9d8e7"/><circle cx="195" cy="245" r="18" fill="#f9a825"/><text x="195" y="250" text-anchor="middle">CG</text><line x1="220" y1="260" x2="220" y2="120" class="l"/><line x1="325" y1="215" x2="325" y2="320" class="f"/><text x="200" y="390" text-anchor="middle" class="s">Force balance + moment balance</text></g>
<g transform="translate(880 75)"><rect width="400" height="430" rx="18" class="p"/><text x="200" y="38" text-anchor="middle" class="t">CG aft</text><path d="M45 235 Q160 170 285 225 L365 185 335 235 380 260 270 265 Q150 300 45 235Z" fill="#b9d8e7"/><circle cx="245" cy="245" r="18" fill="#f9a825"/><text x="245" y="250" text-anchor="middle">CG</text><line x1="220" y1="260" x2="220" y2="120" class="l"/><line x1="325" y1="215" x2="325" y2="280" class="f"/><text x="200" y="378" text-anchor="middle" class="s">Usually less static margin</text><text x="200" y="407" text-anchor="middle" class="s">and less recovery margin</text></g></svg>
