<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc"><title id="title">Policy suggests; value estimates; search allocates trials</title><desc id="desc">Illustrative policy-guided search · invented values · not AlphaGo log data</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d96aa"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8fc"/><text x="35" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#122e46" text-anchor="start" font-weight="700">Policy suggests; value estimates; search allocates trials</text><text x="35" y="75" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536f85" text-anchor="start" font-weight="400">Illustrative policy-guided search · invented values · not AlphaGo log data</text><rect x="330" y="115" width="340" height="100" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="347" y="145" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Current state</text><text x="347" y="172" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Network: policy prior P(a|s)</text><text x="347" y="196" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Network: estimated outcome v(s)</text><path d="M500,215 L255,290" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="290" width="380" height="115" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="82" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Move A</text><text x="82" y="347" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">P = 0.7 · Q = 0.55</text><text x="82" y="371" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Visits = 40 · score ≈ 0.720</text><path d="M500,215 L745,290" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="290" width="380" height="115" rx="9" fill="#e8f4fa" stroke="#d4e0e9"/><text x="572" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Move B</text><text x="572" y="347" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">P = 0.3 · Q = 0.50</text><text x="572" y="371" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Visits = 4 · score ≈ 1.097</text><rect x="165" y="485" width="670" height="100" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="182" y="515" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">Investigate B, then back up the new result</text><text x="182" y="542" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">A lower current mean can be worth exploring when evidence is sparse.</text><text x="182" y="566" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Selection for search is different from a final claim of optimality.</text><path d="M745,405 L600,485" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/><path d="M255,405 L400,485" fill="none" stroke="#9cb1c1" stroke-width="2" marker-end="url(#arrow)"/></svg>