<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d">
<title id="t">Stipa-Caproni conceptual structural load paths</title><desc id="d">Wing, duct, engine and landing loads enter supporting members and attachments, then the central structure. Historical wire bracing changes the wing load path.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17617c"/></marker></defs>
<rect width="1100" height="650" fill="white"/><g font-family="Arial,sans-serif" fill="#172c3e"><text x="35" y="42" font-size="28" font-weight="bold">Follow each force into the structure</text><text x="35" y="73" font-size="18">Functional load paths · engineering interpretation, not a historical stress analysis</text>
<g fill="#edf3f6" stroke="#455d6c" stroke-width="2"><rect x="35" y="115" width="255" height="85" rx="8"/><rect x="35" y="230" width="255" height="85" rx="8"/><rect x="35" y="345" width="255" height="85" rx="8"/><rect x="35" y="460" width="255" height="85" rx="8"/><rect x="355" y="115" width="330" height="85" rx="8"/><rect x="355" y="230" width="330" height="85" rx="8"/><rect x="355" y="345" width="330" height="85" rx="8"/><rect x="355" y="460" width="330" height="85" rx="8"/><rect x="785" y="212" width="275" height="225" rx="8"/></g>
<g font-size="20"><text x="55" y="151">Wing pressure + shear</text><text x="55" y="180">Lift, drag, torque</text><text x="55" y="266">Duct surface pressure</text><text x="55" y="295">Distributed wall loading</text><text x="55" y="381">Engine / propeller</text><text x="55" y="410">Thrust, weight, torque</text><text x="55" y="496">Ground reactions</text><text x="55" y="525">Concentrated landing loads</text>
<text x="373" y="151">Wing members + wire bracing</text><text x="373" y="180">Root / brace attachments</text><text x="373" y="266">Plywood skins + framework</text><text x="373" y="295">Panel-to-support transfer</text><text x="373" y="381">Steel-tube engine support</text><text x="373" y="410">Mounts and attachments</text><text x="373" y="496">Landing gear + local fittings</text><text x="373" y="525">Load spreading at attachments</text>
<text x="807" y="258" font-weight="bold">Central structure</text><text x="807" y="298">Combined bending</text><text x="807" y="330">Shear and torsion</text><text x="807" y="362">Local joint loads</text><text x="807" y="402" font-size="17">Balance with inertia / other loads</text></g>
<g fill="none" stroke="#17617c" stroke-width="3" marker-end="url(#a)"><path d="M290 157H350"/><path d="M290 272H350"/><path d="M290 387H350"/><path d="M290 502H350"/><path d="M685 157H735V250H780"/><path d="M685 272H780"/><path d="M685 387H780"/><path d="M685 502H735V410H780"/></g>
<text x="35" y="590" font-size="20" font-weight="bold">Important: historical wire bracing makes a pure cantilever only a comparison model.</text><text x="35" y="624" font-size="17">Member dimensions, joint stiffness and material properties are needed before calculating actual stresses.</text></g></svg>
