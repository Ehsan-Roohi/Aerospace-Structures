<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Soaring: thermal climb followed by glide</title><desc id="desc">Sun heats a ground patch, warm air rises in a thermal, a vulture gains altitude while circling, then trades height for distance while gliding toward another thermal.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddecfa"/><stop offset="1" stop-color="#fcfaf1"/></linearGradient><linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffca73" stop-opacity=".02"/><stop offset="1" stop-color="#f17a38" stop-opacity=".55"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#dd6934"/></marker><marker id="blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#2867a6"/></marker></defs><rect width="1000" height="430" fill="url(#sky)"/><rect y="348" width="1000" height="82" fill="#b7c896"/><path d="M0 357Q80 330 170 347Q250 368 342 337Q465 312 570 348Q665 371 757 346Q882 322 1000 351" fill="none" stroke="#79976e" stroke-width="5"/><circle cx="75" cy="75" r="35" fill="#ffca5f"/><g stroke="#ffca5f" stroke-width="3"><path d="M75 24v-14M75 126v14M25 75H11M125 75h14M39 39l-11-11M110 110l11 11M39 110l-11 11M110 39l11-11"/></g><path d="M178 350Q160 270 208 198Q255 136 340 76L440 76Q346 174 340 255Q330 322 360 350Z" fill="url(#air)"/><g fill="none" stroke="#df6d3b" stroke-width="5" marker-end="url(#arrow)"><path d="M210 320Q194 242 265 173"/><path d="M290 320Q264 251 317 176"/><path d="M360 306Q355 251 394 203"/></g><path d="M260 145c26-26 64-15 76 6c-27 25-60 20-76-6" stroke="#b56d35" fill="none" stroke-width="3" stroke-dasharray="8 6"/><path d="M299 146l-38-8 27 5 9-11 8 11 30-7-29 13-9-2z" fill="#223c58"/><path d="M400 120C535 96 688 146 795 245" fill="none" stroke="#2867a6" stroke-width="6" stroke-dasharray="11 8" marker-end="url(#blue)"/><path d="M590 148l-42-14 34 5 11-11 9 11 40-5-40 17-12-3z" fill="#223c58"/><path d="M768 242l-42-14 34 5 11-11 9 11 40-5-40 17-12-3z" fill="#223c58"/><g fill="#153a5a" font-family="Arial, Helvetica, sans-serif"><text x="33" y="185" font-size="23" font-weight="700">Solar heating</text><text x="161" y="398" font-size="20">Warmer surface</text><text x="262" y="51" font-size="22" font-weight="700">Climb in updraft</text><text x="261" y="79" font-size="18">w &gt; V_sink</text><text x="540" y="88" font-size="22" font-weight="700">Glide across the landscape</text><text x="551" y="117" font-size="18">Trade potential energy for distance</text><text x="784" y="294" font-size="19">Find the next</text><text x="784" y="318" font-size="19">usable updraft</text></g><path d="M758 350q50-76 102-94" fill="none" stroke="#df6d3b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/></svg>