<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Pressure is not uniform over every edge</title><desc id="d">A schematic pressure map separates field zones, edges and discontinuities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b46e36"/></marker></defs><rect width="1000" height="560" fill="#f4f5f1"/><g font-family="Arial, sans-serif" fill="#1d3845"><text x="42" y="53" font-size="28" font-weight="700">Pressure is not uniform over every edge</text><text x="42" y="88" font-size="17" fill="#536a72">A schematic pressure map separates field zones, edges and discontinuities.</text><rect x="150" y="145" width="690" height="300" fill="#dae4dd" stroke="#24424f" stroke-width="4"/><rect x="150" y="145" width="690" height="45" fill="#b46e36" opacity=".45"/><rect x="150" y="400" width="690" height="45" fill="#b46e36" opacity=".45"/><rect x="150" y="145" width="55" height="300" fill="#b46e36" opacity=".45"/><rect x="785" y="145" width="55" height="300" fill="#b46e36" opacity=".45"/><path d="M55 280H130" stroke="#b46e36" stroke-width="5" marker-end="url(#arrow)"/><text x="235" y="250" font-size="22">field pressure</text><text x="235" y="285" font-size="19">depends on pressure difference</text><text x="235" y="320" font-size="19">across the surface</text><text x="235" y="365" font-size="20">edges: local attachment demand</text><text x="210" y="485" font-size="19">Illustration only: no code coefficients or design pressures assigned.</text></g><text x="42" y="535" fill="#63777a" font-family="Arial,sans-serif" font-size="15">Original teaching diagram · conceptual geometry, not a reconstruction of Plant 2</text></svg>