17749d"/><circle cx="1263" cy="608" r="5" fill="#17749d"/><circle cx="1263" cy="657" r="5" fill="#17749d"/><circle cx="1263" cy="706" r="5" fill="#17749d"/><circle cx="1308" cy="510" r="5" fill="#17749d"/><circle cx="1308" cy="559" r="5" fill="#17749d"/><circle cx="1308" cy="608" r="5" fill="#17749d"/><circle cx="1308" cy="657" r="5" fill="#17749d"/><circle cx="1308" cy="706" r="5" fill="#17749d"/><circle cx="1353" cy="510" r="5" fill="#17749d"/><circle cx="1353" cy="559" r="5" fill="#17749d"/><circle cx="1353" cy="608" r="5" fill="#17749d"/><circle cx="1353" cy="657" r="5" fill="#17749d"/><circle cx="1353" cy="706" r="5" fill="#17749d"/><circle cx="1398" cy="510" r="5" fill="#17749d"/><circle cx="1398" cy="559" r="5" fill="#17749d"/><circle cx="1398" cy="608" r="5" fill="#17749d"/><circle cx="1398" cy="657" r="5" fill="#17749d"/><circle cx="1398" cy="706" r="5" fill="#17749d"/><circle cx="1443" cy="510" r="5" fill="#17749d"/><circle cx="1443" cy="559" r="5" fill="#17749d"/><circle cx="1443" cy="608" r="5" fill="#17749d"/><circle cx="1443" cy="657" r="5" fill="#17749d"/><circle cx="1443" cy="706" r="5" fill="#17749d"/><circle cx="1488" cy="510" r="5" fill="#17749d"/><circle cx="1488" cy="559" r="5" fill="#17749d"/><circle cx="1488" cy="608" r="5" fill="#17749d"/><circle cx="1488" cy="657" r="5" fill="#17749d"/><circle cx="1488" cy="706" r="5" fill="#17749d"/><circle cx="1533" cy="510" r="5" fill="#17749d"/><circle cx="1533" cy="559" r="5" fill="#17749d"/><circle cx="1533" cy="608" r="5" fill="#17749d"/><circle cx="1533" cy="657" r="5" fill="#17749d"/><circle cx="1533" cy="706" r="5" fill="#17749d"/><circle cx="1578" cy="510" r="5" fill="#17749d"/><circle cx="1578" cy="559" r="5" fill="#17749d"/><circle cx="1578" cy="608" r="5" fill="#17749d"/><circle cx="1578" cy="657" r="5" fill="#17749d"/><circle cx="1578" cy="706" r="5" fill="#17749d"/><circle cx="1623" cy="510" r="5" fill="#17749d"/><circle cx="1623" cy="559" r="5" fill="#17749d"/><circle cx="1623" cy="608" r="5