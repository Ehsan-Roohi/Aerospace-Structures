<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#edf4fa"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176c8e"/></marker></defs><g font-family="sans-serif" font-size="22" fill="#18364a"><text x="40" y="45" font-size="28">Velocity addition: aircraft + moving air mass</text><g stroke="#176c8e" stroke-width="7" marker-end="url(#a)"><path d="M80 120H580"/><path d="M580 120H780"/><path d="M80 255H780"/></g><text x="190" y="95">Airspeed: 250 m/s</text><text x="590" y="165">Tailwind: 100 m/s</text><text x="245" y="235">Groundspeed: 350 m/s</text><text x="40" y="335">Mach and dynamic pressure use airspeed, not groundspeed.</text><text x="40" y="375" font-size="17">Illustrative aligned vectors. Crosswind requires a wind triangle.</text></g></svg>