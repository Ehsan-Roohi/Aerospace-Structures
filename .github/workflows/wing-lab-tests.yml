name: Wing Lab regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DOM, GLB and real-browser test dependencies
        timeout-minutes: 10
        # Keep r147 for GLB tests and the page's r128/OrbitControls as a separate alias.
        run: npm install --prefix /tmp/wing-lab-tests jsdom@26 three@0.147.0 three-r128@npm:three@0.128.0 playwright@1.64.1
      - name: Install Chromium and its Linux dependencies
        timeout-minutes: 15
        working-directory: /tmp/wing-lab-tests
        run: npx playwright install --with-deps chromium
      - name: Check generated page is current and run all regression suites
        timeout-minutes: 45
        env:
          MIE446_JSDOM_MODULE: /tmp/wing-lab-tests/node_modules/jsdom
          MIE446_THREE_MODULE: /tmp/wing-lab-tests/node_modules/three
          PLAYWRIGHT_MODULE: /tmp/wing-lab-tests/node_modules/playwright/index.mjs
          BEAM_THREE_DIR: /tmp/wing-lab-tests/node_modules/three-r128
          WING_THREE_DIR: /tmp/wing-lab-tests/node_modules/three-r128
        run: |
          python computational/printed-wing-solver/web/build_wing_lab.py
          git diff --exit-code -- docs/wing-lab.html docs/truss-lab.html
          for suite in computational/printed-wing-solver/web/test_*.mjs computational/printed-wing-solver/web/verify_engine.mjs; do
            node "$suite"
          done
