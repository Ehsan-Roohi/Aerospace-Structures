<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aero comparison · Wing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="workspace.css?v=2.0.2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 76 56'%3E%3Cpath d='M3 36 C 12 20, 40 18, 73 33 L 73 35 C 40 42, 14 44, 3 36 Z' fill='none' stroke='%234ea6ff' stroke-width='3'/%3E%3Cpath d='M6 24 C 14 2, 34 6, 70 20' fill='none' stroke='%23ff9f43' stroke-width='3' stroke-dasharray='6 4'/%3E%3C/svg%3E">
</head>
<body>
<nav id="wingNavigation" class="workspace-nav" aria-label="Workspaces">
  <a class="workspace-link" href="../#beam">Beam</a>
  <a class="workspace-link" href="../truss-lab.html">Truss</a>
  <a class="workspace-link" href="../#wing">Wing</a>
  <a class="workspace-link" href="../#d520">Full-scale wing</a>
  <a class="workspace-link" href="https://vinco-rc.com/?generator=wing" target="_blank" rel="noopener noreferrer">Wing geometry tool</a>
  <a class="workspace-link" aria-current="page" href="#comparison">◈ Aero comparison</a>
  <a class="workspace-link" href="../../hydrofoil-cavitation-lab/" target="_blank" rel="noopener noreferrer">Cavitation</a>
</nav>
<div id="app">
  <header class="bar panel" aria-label="Commands">
    <div class="brand">
      <svg viewBox="0 0 76 56" aria-hidden="true"><path d="M3 36 C 12 20, 40 18, 73 33 L 73 35 C 40 42, 14 44, 3 36 Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 24 C 14 2, 34 6, 70 20" fill="none" stroke="#ff9f43" stroke-width="3" stroke-dasharray="6 4"/><circle cx="24" cy="33" r="3" fill="currentColor"/><circle cx="46" cy="33" r="3" fill="currentColor"/></svg>
      <div><b>Aero comparison</b><small>Panel method · Machine learning · Reference data</small></div>
    </div>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" id="modeSection" aria-pressed="true">Section · 2D</button>
      <button type="button" id="modeWing" aria-pressed="false">Wing · 3D</button>
    </div>
    <div class="status" id="chips"></div>
    <button class="tool" type="button" id="helpBtn">Help</button>
  </header>

  <aside class="side panel" id="side" aria-label="Controls">
    <div id="sideSection">
      <fieldset><legend>Case</legend>
        <div class="field"><label for="foil">Section</label><select id="foil"></select></div>
        <div class="field"><label for="alpha">Angle α <small>0 to 30°, ML recorded to 12°</small></label><select id="alpha"></select></div>
        <div class="field wide"><input id="alphaSlider" type="range" min="0" max="30" step="0.1" value="0" aria-label="Angle of attack slider"></div>
        <div class="field"><label for="re">Reynolds <small>scope check only, not a model input</small></label><input id="re" type="number" value="3000000" min="1" step="100000"></div>
      </fieldset>
      <fieldset><legend>Reference</legend>
        <div class="field"><label for="referenceSet">Dataset</label><select id="referenceSet"><option value="cfd">NACA 0012 · CFL3D CFD</option><option value="experiment">NACA 4412 · TR-613 tunnel</option></select></div>
        <div class="row"><button class="btn" type="button" id="useReference">Use reference conditions</button><label class="btn" for="referenceFile">Import JSON</label><input id="referenceFile" type="file" accept=".json,application/json" hidden></div>
        <p class="note" id="importStatus"></p>
      </fieldset>
      <fieldset><legend>Panel mesh</legend>
        <div class="field"><label for="panelN">Panels per surface</label><input id="panelN" type="number" min="16" max="512" step="1" value="160"></div>
        <div class="row"><button class="btn" type="button" id="panelRecompute">Recompute</button><button class="btn" type="button" id="meshCheck">Convergence</button><button class="btn" type="button" id="dat">DAT</button></div>
      </fieldset>
      <fieldset><legend>Screening</legend>
        <div class="field"><label for="clmin">Minimum cl</label><input id="clmin" type="number" step="0.05" value="0.15"></div>
        <div class="field"><label for="xsc">Reference x/c</label><input id="xsc" type="number" min="0" max="1" step="0.01" value="0.35"></div>
        <div class="field"><label for="zsc">Reference z/c</label><input id="zsc" type="number" min="-1" max="1" step="0.01" value="0"></div>
      </fieldset>
    </div>
    <div id="sideWing" hidden>
      <fieldset><legend>Recorded benchmark</legend>
        <div class="field"><label for="wing">Case</label><select id="wing"></select></div>
        <div class="field"><label for="eta">Station η</label><select id="eta"></select></div>
        <div class="field"><label for="mesh">Panel mesh</label><select id="mesh"><option value="0">288 · 16×8</option><option value="1">672 · 24×12</option><option value="2" selected>1152 · 32×16</option></select></div>
        <div class="row"><button class="btn run" type="button" id="solve">Re-solve panel</button></div>
        <p class="note" id="runStatus"></p>
      </fieldset>
      <fieldset><legend>Prediction service</legend>
        <div class="field wide"><label for="endpoint">LWM service endpoint <small>empty = offline, recorded benchmarks only; "mock" = adapter test on recorded cases</small></label><input id="endpoint" type="text" placeholder="http://localhost:8765" autocomplete="off"></div>
        <div class="row"><button class="btn" type="button" id="probe">Connect</button><button class="btn" type="button" id="screenBtn" disabled>Screen candidates</button></div>
      </fieldset>
      <fieldset id="candFs" hidden><legend>Candidates</legend>
        <div class="field"><label for="candSection">Section</label><select id="candSection"></select></div>
        <div class="field"><label for="candAlpha">α <small>deg</small></label><input id="candAlpha" type="number" step="0.1" value="4"></div>
        <div class="field"><label for="candMach">Mach</label><input id="candMach" type="number" step="0.01" value="0.15"></div>
        <div class="field"><label for="candSC">s/c list</label><input id="candSC" type="text" value="2.5, 2.95, 3.29, 4"></div>
        <div class="field"><label for="candTaper">Taper list</label><input id="candTaper" type="text" value="1"></div>
        <div class="field"><label for="candSweep">Sweep list <small>deg</small></label><input id="candSweep" type="text" value="0"></div>
        <div class="field"><label for="objective">Objective</label><select id="objective"><option value="maxCL">max CL</option><option value="minAbsCm">min |Cm|</option><option value="minRootBending">min root bending</option></select></div>
        <div class="field"><label for="minCLw">CL target <small>root-bending objective</small></label><input id="minCLw" type="number" step="0.05" value="0.3"></div>
        <div class="field"><label for="topK">Full uncertainty for top</label><input id="topK" type="number" min="1" max="10" value="3"></div>
      </fieldset>
    </div>
  </aside>

  <main class="main">
    <section class="panel strip" id="strip" aria-live="polite"></section>
    <section class="panel dock">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panels"></div>
    </section>
    <div class="docs" id="docs"></div>
  </main>
</div>
<script src="screen.js?v=2.0.2"></script>
<script src="panel2d.js?v=2.0.2"></script>
<script src="panel-geometry.js?v=2.0.2"></script>
<script src="wing-compare.js?v=2.0.2"></script>
<script src="lwm-client.js?v=2.0.2"></script>
<script src="app.js?v=2.0.2"></script>
</body>
</html>
