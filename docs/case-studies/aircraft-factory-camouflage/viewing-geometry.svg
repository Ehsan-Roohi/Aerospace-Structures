<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">The observer determines the illusion</title><desc id="d">Overhead projection and an oblique line of sight reveal different information.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b46e36"/></marker></defs><rect width="1000" height="560" fill="#f4f5f1"/><g font-family="Arial, sans-serif" fill="#1d3845"><text x="42" y="53" font-size="28" font-weight="700">The observer determines the illusion</text><text x="42" y="88" font-size="17" fill="#536a72">Overhead projection and an oblique line of sight reveal different information.</text><path d="M100 365H640V435H100Z" fill="#ced9d9" stroke="#263e48" stroke-width="4"/><path d="M140 365L180 330L220 365M290 365L330 330L370 365M450 365L490 330L530 365" fill="#b6c6b3" stroke="#456252" stroke-width="4"/><path d="M320 140V315M850 200L590 350" stroke="#b46e36" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><circle cx="320" cy="130" r="12" fill="#b46e36"/><circle cx="860" cy="195" r="12" fill="#b46e36"/><text x="225" y="115" font-size="21">overhead observer</text><text x="690" y="165" font-size="21">oblique observer</text><text x="180" y="470" font-size="21">industrial building remains underneath</text><text x="660" y="370" font-size="18">sidewall and height</text><text x="660" y="400" font-size="18">can become visible</text></g><text x="42" y="535" fill="#63777a" font-family="Arial,sans-serif" font-size="15">Original teaching diagram · conceptual geometry, not a reconstruction of Plant 2</text></svg>