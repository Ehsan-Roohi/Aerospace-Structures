<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b42318"/></marker><style>text{font-family:Arial,sans-serif;fill:#172b4d}.t{font-size:30px;font-weight:bold}.s{font-size:22px;font-weight:bold}.b{fill:#e8f3f8;stroke:#2f6080;stroke-width:3}.r{stroke:#b42318;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1400" height="520" fill="white"/><text x="700" y="52" text-anchor="middle" class="t">Follow the load: air → skin → ribs/stringers → spars → root → fuselage</text>
<g transform="translate(40 150)"><rect width="180" height="130" rx="16" class="b"/><text x="90" y="58" text-anchor="middle" class="s">Air pressure</text><text x="90" y="90" text-anchor="middle">distributed load</text></g><line x1="225" y1="215" x2="290" y2="215" class="r"/>
<g transform="translate(300 150)"><rect width="180" height="130" rx="16" class="b"/><text x="90" y="58" text-anchor="middle" class="s">Skin</text><text x="90" y="90" text-anchor="middle">receives pressure</text></g><line x1="485" y1="215" x2="550" y2="215" class="r"/>
<g transform="translate(560 150)"><rect width="220" height="130" rx="16" class="b"/><text x="110" y="50" text-anchor="middle" class="s">Ribs + stringers</text><text x="110" y="82" text-anchor="middle">shape, transfer,</text><text x="110" y="110" text-anchor="middle">stabilize skin</text></g><line x1="785" y1="215" x2="850" y2="215" class="r"/>
<g transform="translate(860 150)"><rect width="170" height="130" rx="16" class="b"/><text x="85" y="58" text-anchor="middle" class="s">Spars</text><text x="85" y="90" text-anchor="middle">beam resultants</text></g><line x1="1035" y1="215" x2="1100" y2="215" class="r"/>
<g transform="translate(1110 150)"><rect width="220" height="130" rx="16" class="b"/><text x="110" y="48" text-anchor="middle" class="s">Wing root</text><text x="110" y="80" text-anchor="middle">shear, bending,</text><text x="110" y="108" text-anchor="middle">torsion → fuselage</text></g><text x="700" y="390" text-anchor="middle" class="s">A break at any connection breaks the load path—even if each isolated part looks strong.</text></svg>
