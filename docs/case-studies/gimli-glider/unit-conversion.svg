<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Correct and incorrect fuel-unit calculations for Air Canada Flight 143</title>
  <desc id="desc">Two parallel calculation paths show how 7682 litres should have been converted to kilograms and how using 1.77 pounds per litre as kilograms per litre led to only 4916 litres being added.</desc>
  <defs><style>.bg{fill:#f7f8fa}.good{fill:#edf8f1;stroke:#287a46;stroke-width:3}.bad{fill:#fff0f0;stroke:#a62020;stroke-width:3}.head{font:700 30px Arial,sans-serif;fill:#221328}.t{font:700 23px Arial,sans-serif;fill:#221328}.s{font:20px Arial,sans-serif;fill:#342f37}.u{font:700 20px Arial,sans-serif;fill:#5b2c6f}.arrow{stroke:#633574;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#633574"/></marker></defs>
  <rect class="bg" width="1400" height="760" rx="20"/><text x="700" y="52" text-anchor="middle" class="head">The arithmetic was consistent; the dimensions were not</text>
  <text x="350" y="105" text-anchor="middle" class="head" fill="#287a46">Correct SI path</text><text x="1050" y="105" text-anchor="middle" class="head" fill="#a62020">Path used in Montreal</text>
  <g transform="translate(80 140)"><rect class="good" width="540" height="110" rx="16"/><text x="270" y="39" text-anchor="middle" class="t">Measured volume</text><text x="270" y="78" text-anchor="middle" class="s">7,682 L</text></g>
  <g transform="translate(780 140)"><rect class="bad" width="540" height="110" rx="16"/><text x="270" y="39" text-anchor="middle" class="t">Measured volume</text><text x="270" y="78" text-anchor="middle" class="s">7,682 L</text></g>
  <path class="arrow" d="M350 255V300"/><path class="arrow" d="M1050 255V300"/>
  <g transform="translate(80 305)"><rect class="good" width="540" height="130" rx="16"/><text x="270" y="39" text-anchor="middle" class="t">Convert volume to mass</text><text x="270" y="78" text-anchor="middle" class="s">7,682 L × 0.803 kg/L</text><text x="270" y="108" text-anchor="middle" class="u">= 6,169 kg</text></g>
  <g transform="translate(780 305)"><rect class="bad" width="540" height="130" rx="16"/><text x="270" y="39" text-anchor="middle" class="t">Wrong unit attached to 1.77</text><text x="270" y="78" text-anchor="middle" class="s">7,682 L × 1.77 lb/L = 13,597 lb</text><text x="270" y="108" text-anchor="middle" class="u">13,597 lb was treated as 13,597 kg</text></g>
  <path class="arrow" d="M350 440V485"/><path class="arrow" d="M1050 440V485"/>
  <g transform="translate(80 490)"><rect class="good" width="540" height="160" rx="16"/><text x="270" y="38" text-anchor="middle" class="t">Fuel to add</text><text x="270" y="76" text-anchor="middle" class="s">22,300 − 6,169 = 16,131 kg</text><text x="270" y="108" text-anchor="middle" class="s">16,131 kg ÷ 0.803 kg/L</text><text x="270" y="140" text-anchor="middle" class="u">≈ 20,088 L required</text></g>
  <g transform="translate(780 490)"><rect class="bad" width="540" height="160" rx="16"/><text x="270" y="38" text-anchor="middle" class="t">Fuel to add</text><text x="270" y="76" text-anchor="middle" class="s">22,300 − 13,597 = 8,703 “kg”</text><text x="270" y="108" text-anchor="middle" class="s">8,703 ÷ 1.77</text><text x="270" y="140" text-anchor="middle" class="u">≈ 4,916 L added</text></g>
  <text x="700" y="710" text-anchor="middle" class="s">Unit cancellation is the check: L × kg/L → kg. The factor 1.77 carried lb/L, not kg/L.</text>
</svg>
