<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><style>text{font-family:Arial,sans-serif;fill:#183347} .title{font-size:25px;font-weight:bold} .label{font-size:18px} .small{font-size:15px} .wing{fill:none;stroke:#126d8c;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1000" height="420" fill="#f5f9fb"/><title>Three wingtip concepts in front view</title><text x="35" y="42" class="title">Nonplanar tips change the combined lifting system</text><rect x="35" y="72" width="300" height="270" rx="12" fill="white" stroke="#cfdae1"/><text x="55" y="106" class="label">Bare tip</text><rect x="365" y="72" width="300" height="270" rx="12" fill="white" stroke="#cfdae1"/><text x="385" y="106" class="label">Blended tip</text><rect x="695" y="72" width="300" height="270" rx="12" fill="white" stroke="#cfdae1"/><text x="715" y="106" class="label">Split-tip concept</text><path d="M60 275 H290" class="wing"/><path d="M390 275 H535 Q580 275 593 225 L625 150" class="wing"/><path d="M720 275 H865 Q910 275 923 225 L955 150" class="wing"/><path d="M898 265 L955 320" fill="none" stroke="#cb642a" stroke-width="10" stroke-linecap="round"/><text x="55" y="325" class="small">Planar reference</text><text x="385" y="325" class="small">Smooth upper transition</text><text x="715" y="370" class="small">Orange: lower / ventral surface</text><text x="35" y="402" class="small">Conceptual front views; flow is perpendicular to the page. Not to scale or manufacturer geometry.</text></svg>