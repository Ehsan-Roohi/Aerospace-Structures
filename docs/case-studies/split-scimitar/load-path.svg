<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><style>text{font-family:Arial,sans-serif;fill:#183347} .title{font-size:25px;font-weight:bold} .label{font-size:18px} .small{font-size:15px} .wing{fill:none;stroke:#126d8c;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1000" height="420" fill="#f5f9fb"/><title>Generic structural load-transfer sequence for a winglet</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#cb642a" stroke-width="1.5"/></marker></defs><text x="35" y="42" class="title">Aerodynamic pressure must reach the wing box</text><rect x="35" y="95" width="205" height="140" rx="12" fill="white" stroke="#126d8c" stroke-width="2"/><text x="47" y="125" class="label">Surface traction</text><text x="47" y="166" class="small">Pressure + skin friction</text><text x="47" y="194" class="small">Distributed aerodynamic load</text><path d="M243 160 H275" stroke="#cb642a" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="95" width="205" height="140" rx="12" fill="white" stroke="#126d8c" stroke-width="2"/><text x="292" y="125" class="label">Skin + members</text><text x="292" y="166" class="small">Skin, caps, webs, ribs</text><text x="292" y="194" class="small">Bending / shear / torsion</text><path d="M488 160 H520" stroke="#cb642a" stroke-width="3" marker-end="url(#a)"/><rect x="525" y="95" width="205" height="140" rx="12" fill="white" stroke="#126d8c" stroke-width="2"/><text x="537" y="125" class="label">Attachment</text><text x="537" y="166" class="small">Fasteners + fittings</text><text x="537" y="194" class="small">Forces AND moments</text><path d="M733 160 H765" stroke="#cb642a" stroke-width="3" marker-end="url(#a)"/><rect x="770" y="95" width="205" height="140" rx="12" fill="white" stroke="#126d8c" stroke-width="2"/><text x="782" y="125" class="label">Main-wing box</text><text x="782" y="166" class="small">Spars + skins</text><text x="782" y="194" class="small">Loads continue to root</text><rect x="35" y="272" width="940" height="90" rx="12" fill="#e6eff4"/><text x="55" y="303" class="label">At each interface: preserve the full force and moment balance.</text><text x="55" y="335" class="label">For dynamics, include mass, inertia, attachment flexibility and unsteady airloads.</text><text x="35" y="402" class="small">Generic load path, not the verified internal layout of the filmed APB assembly.</text></svg>