<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">Conceptual braced wing free body diagram</title><desc id="d">A wing panel with distributed lift, root reactions and a tension wire.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17617c"/></marker></defs><rect width="1100" height="600" fill="white"/><g font-family="Arial,sans-serif" fill="#172c3e"><text x="35" y="42" font-size="28" font-weight="bold">Wing lift becomes a braced structural system</text><text x="35" y="72" font-size="18">Free-body diagram: illustrative load directions only</text><rect x="180" y="255" width="620" height="35" fill="#dfeaec" stroke="#29485b" stroke-width="3"/><rect x="145" y="205" width="35" height="210" fill="#cbd9df" stroke="#29485b" stroke-width="3"/><path d="M215 290L580 470" stroke="#b36a25" stroke-width="6"/><text x="385" y="402" font-size="19" fill="#8d4b18">Tension wire</text><g stroke="#17617c" stroke-width="3" marker-end="url(#a)"><path d="M280 235V165"/><path d="M410 235V165"/><path d="M540 235V165"/><path d="M670 235V165"/><path d="M580 470L530 445"/><path d="M150 360H70"/><path d="M165 255V175"/><path d="M165 290V375"/></g><text x="252" y="145" font-size="20">Distributed aerodynamic lift w(y)</text><text x="594" y="449" font-size="19">Wire force T</text><text x="38" y="352" font-size="19">Root axial</text><text x="38" y="376" font-size="19">reaction</text><text x="182" y="157" font-size="19">Root shear</text><text x="182" y="398" font-size="19">Root moment</text><path d="M540 470 A62 62 0 0 0 500 437" fill="none" stroke="#8d4b18" stroke-width="2"/><text x="486" y="500" font-size="20">θ</text><text x="765" y="175" font-size="21" font-weight="bold">Interpretation</text><text x="765" y="213" font-size="18">A shallow wire angle raises</text><text x="765" y="241" font-size="18">the tension needed for a</text><text x="765" y="269" font-size="18">given vertical contribution.</text><text x="765" y="323" font-size="18">The brace can reduce root</text><text x="765" y="351" font-size="18">bending while increasing</text><text x="765" y="379" font-size="18">attachment and compression</text><text x="765" y="407" font-size="18">loads elsewhere.</text><text x="35" y="555" font-size="17">A tension wire is unilateral: under a reversed load, another wire or a different path must carry the load.</text></g></svg>
