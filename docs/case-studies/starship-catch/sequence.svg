<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><title>From orbital return to structural support</title><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#087f8c"/></marker></defs><rect width="1000" height="460" fill="#f4f8fc"/><g font-family="Arial,sans-serif" fill="#142c44"><text x="35" y="42" font-size="25" font-weight="bold">From orbital return to structural support</text><rect x="25" y="100" width="225" height="220" rx="12" fill="white" stroke="#94b6c9"/><text x="40" y="135" font-size="20" font-weight="bold">01 · Deorbit</text><text x="40" y="190" font-size="16">Target entry corridor</text><text x="40" y="250" font-size="14">Orbital energy remains high</text><path d="M250 285h18" stroke="#087f8c" stroke-width="3" marker-end="url(#arr)"/><rect x="270" y="100" width="225" height="220" rx="12" fill="white" stroke="#94b6c9"/><text x="285" y="135" font-size="20" font-weight="bold">02 · Entry</text><text x="285" y="190" font-size="16">Heat shield + attitude</text><text x="285" y="250" font-size="14">Drag removes most energy</text><path d="M495 285h18" stroke="#087f8c" stroke-width="3" marker-end="url(#arr)"/><rect x="515" y="100" width="225" height="220" rx="12" fill="white" stroke="#94b6c9"/><text x="530" y="135" font-size="20" font-weight="bold">03 · Landing burn</text><text x="530" y="190" font-size="16">Reduce speed + align</text><text x="530" y="250" font-size="14">Engines control approach</text><path d="M740 285h18" stroke="#087f8c" stroke-width="3" marker-end="url(#arr)"/><rect x="760" y="100" width="225" height="220" rx="12" fill="white" stroke="#94b6c9"/><text x="775" y="135" font-size="20" font-weight="bold">04 · Capture</text><text x="775" y="190" font-size="16">Engage support interfaces</text><text x="775" y="250" font-size="14">Load transfers to tower</text><text x="35" y="380" font-size="19">Before contact: low relative speed, small attitude error, compatible tower motion.</text><text x="35" y="420" font-size="16">Conceptual sequence only — not flight telemetry or a scaled trajectory.</text></g></svg>