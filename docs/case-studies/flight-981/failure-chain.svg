<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">One structural event can defeat nominally redundant controls</title><desc id="desc">The failure chain links incorrect door restraint, decompression, floor damage and a shared control-routing zone. Three drawn paths are conceptual, not the actual DC-10 circuit count.</desc><rect width="100%" height="100%" fill="white"/>
<text x="28" y="41.36" font-family="Arial,sans-serif" font-size="26" fill="#1b3144" font-weight="700">One structural event can defeat nominally redundant controls</text>
<rect x="45" y="95" width="610" height="85" fill="#fff5ee" stroke="#1b3144" stroke-width="2"/>
<text x="63" y="128.78" font-family="Arial,sans-serif" font-size="23" fill="#1b3144" font-weight="700">Incorrect door restraint</text>
<text x="63" y="160.34" font-family="Arial,sans-serif" font-size="19" fill="#1b3144">Indication does not prove engagement</text>
<line x1="350" y1="180" x2="350" y2="203" stroke="#b33939" stroke-width="3"/>
<polygon points="350,203 344.78041359066526,192.19463477176788 355.21958640933474,192.19463477176788" fill="#b33939"/>
<rect x="45" y="211" width="610" height="85" fill="#fff5ee" stroke="#1b3144" stroke-width="2"/>
<text x="63" y="244.78" font-family="Arial,sans-serif" font-size="23" fill="#1b3144" font-weight="700">Door separates</text>
<text x="63" y="276.34" font-family="Arial,sans-serif" font-size="19" fill="#1b3144">Cargo pressure falls rapidly</text>
<line x1="350" y1="296" x2="350" y2="319" stroke="#b33939" stroke-width="3"/>
<polygon points="350,319 344.78041359066526,308.1946347717679 355.21958640933474,308.1946347717679" fill="#b33939"/>
<rect x="45" y="327" width="610" height="85" fill="#fff5ee" stroke="#1b3144" stroke-width="2"/>
<text x="63" y="360.78" font-family="Arial,sans-serif" font-size="23" fill="#1b3144" font-weight="700">Floor differential develops</text>
<text x="63" y="392.34" font-family="Arial,sans-serif" font-size="19" fill="#1b3144">Floor bends / deforms / disrupts</text>
<line x1="350" y1="412" x2="350" y2="435" stroke="#b33939" stroke-width="3"/>
<polygon points="350,435 344.78041359066526,424.1946347717679 355.21958640933474,424.1946347717679" fill="#b33939"/>
<rect x="45" y="443" width="610" height="85" fill="#fff0ee" stroke="#1b3144" stroke-width="2"/>
<text x="63" y="476.78" font-family="Arial,sans-serif" font-size="23" fill="#1b3144" font-weight="700">Shared routing zone damaged</text>
<text x="63" y="508.34" font-family="Arial,sans-serif" font-size="19" fill="#1b3144">Control authority is lost</text>
<rect x="785" y="215" width="330" height="260" fill="#f7fafc" stroke="#1b3144" stroke-width="2"/>
<text x="806" y="252.2" font-family="Arial,sans-serif" font-size="20" fill="#1b3144" font-weight="700">One floor damage zone</text>
<line x1="735" y1="306" x2="1155" y2="306" stroke="#176b94" stroke-width="5"/>
<line x1="930" y1="294" x2="956" y2="318" stroke="#b33939" stroke-width="5"/>
<line x1="930" y1="318" x2="956" y2="294" stroke="#b33939" stroke-width="5"/>
<line x1="735" y1="361" x2="1155" y2="361" stroke="#287965" stroke-width="5"/>
<line x1="930" y1="349" x2="956" y2="373" stroke="#b33939" stroke-width="5"/>
<line x1="930" y1="373" x2="956" y2="349" stroke="#b33939" stroke-width="5"/>
<line x1="735" y1="416" x2="1155" y2="416" stroke="#a66612" stroke-width="5"/>
<line x1="930" y1="404" x2="956" y2="428" stroke="#b33939" stroke-width="5"/>
<line x1="930" y1="428" x2="956" y2="404" stroke="#b33939" stroke-width="5"/>
<text x="774" y="515.2" font-family="Arial,sans-serif" font-size="20" fill="#1b3144">Separate circuits can share</text>
<text x="774" y="546.2" font-family="Arial,sans-serif" font-size="20" fill="#1b3144">the same physical vulnerability.</text>
<text x="28" y="614.62" font-family="Arial,sans-serif" font-size="17" fill="#1b3144">Conceptual control paths only. Physical separation and structural protection require a system-level assessment.</text>
</svg>