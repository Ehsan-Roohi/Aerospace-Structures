<rect width="1100" height="610" fill="white"/><g font-family="Arial,sans-serif" fill="#172c3e">
<text x="36" y="40" font-size="27" font-weight="bold">A powered duct is not a passive Venturi</text>
<text x="36" y="70" font-size="18">Conceptual longitudinal section · not to scale · not an as-built drawing</text>
<path d="M240 160 Q400 95 570 145 L820 180 L820 210 Q610 160 440 195 Q330 205 240 200Z" fill="#dce8ec" stroke="#253f50" stroke-width="3"/>
