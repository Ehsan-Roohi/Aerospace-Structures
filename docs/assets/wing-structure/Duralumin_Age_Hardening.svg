<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1030" viewBox="0 0 1800 1030" role="img"><title>Strong aluminium requires more than mixing ingredients</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#19364b"/></marker></defs><rect width="1800" height="1030" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="70" font-size="43" text-anchor="start" fill="#19364b">Strong aluminium requires more than mixing ingredients</text><text x="65" y="122" font-size="29" text-anchor="start" fill="#19364b">Composition selects the alloy; processing controls the final microstructure and properties.</text><text x="65" y="195" font-size="32" text-anchor="start" fill="#19364b">Duralumin / Super Duralumin</text><text x="995" y="195" font-size="32" text-anchor="start" fill="#19364b">Zero spar caps: ESD</text><text x="65" y="242" font-size="30" text-anchor="start" fill="#19364b">Aluminium + copper + magnesium</text><text x="995" y="242" font-size="30" text-anchor="start" fill="#19364b">Aluminium + zinc + magnesium + copper</text><text x="65" y="284" font-size="27" text-anchor="start" fill="#19364b">Minor additions vary by historical grade.</text><text x="995" y="284" font-size="27" text-anchor="start" fill="#19364b">Minor manganese / chromium additions</text><path d="M65,320 L1735,320" fill="none" stroke="#a4b8c5" stroke-width="4" /><text x="65" y="379" font-size="33" text-anchor="start" fill="#19364b">How age hardening works: a simplified microscopic picture</text><text x="75" y="443" font-size="31" text-anchor="start" fill="#19364b">1  Solution treatment</text><rect x="75" y="478" width="470" height="280" fill="#e4f0f5" stroke="#a4b8c5" stroke-width="3"/><circle cx="103" cy="510" r="5" fill="#17749d"/><circle cx="103" cy="559" r="5" fill="#17749d"/><circle cx="103" cy="608" r="5" fill="#17749d"/><circle cx="103" cy="657" r="5" fill="#17749d"/><cir