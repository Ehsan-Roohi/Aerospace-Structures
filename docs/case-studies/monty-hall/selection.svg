<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">An offer is selected evidence</title><desc id="desc">Expected counts out of 300 games · a = 1 · b = 0.1</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d96aa"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8fc"/><text x="35" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#122e46" text-anchor="start" font-weight="700">An offer is selected evidence</text><text x="35" y="75" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536f85" text-anchor="start" font-weight="400">Expected counts out of 300 games · a = 1 · b = 0.1</text><rect x="45" y="120" width="385" height="100" rx="9" fill="#fff6e5" stroke="#d4e0e9"/><text x="62" y="150" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">100 initially correct</text><text x="62" y="177" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Offer rate 100%</text><text x="62" y="201" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">100 offers → staying wins</text><rect x="45" y="315" width="385" height="100" rx="9" fill="#e9f6fb" stroke="#d4e0e9"/><text x="62" y="345" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">200 initially wrong</text><text x="62" y="372" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Offer rate 10%</text><text x="62" y="396" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">20 offers → switching wins</text><path d="M430,170 L595,230" fill="none" stroke="#c59a4e" stroke-width="12" marker-end="url(#arrow)"/><path d="M430,365 L595,280" fill="none" stroke="#2784a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="600" y="190" width="350" height="135" rx="9" fill="#fff" stroke="#d4e0e9"/><text x="617" y="220" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="700">120 offered games</text><text x="617" y="247" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">100 correct + 20 wrong</text><text x="617" y="271" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Switch win = 20 / 120 = 1/6</text><text x="617" y="295" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#193b53" text-anchor="start" font-weight="400">Remaining 180 games: no offer</text><text x="45" y="495" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193b53" text-anchor="start" font-weight="400">The offered sample has a different mixture from the original population.</text></svg>