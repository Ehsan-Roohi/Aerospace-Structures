<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Hinged and compliant wing concepts</title><desc id="d">A sharp hinged trailing edge compared with distributed smooth deformation. Conceptual illustration only.</desc><rect width="1000" height="440" fill="#eef5f8"/><g font-family="sans-serif" fill="#17374c"><text x="40" y="45" font-size="25">Two ways to change a wing section</text><text x="40" y="97" font-size="21">Hinged surface</text><text x="535" y="97" font-size="21">Distributed compliance</text></g><g fill="none" stroke-width="5"><path d="M40 200 Q150 110 340 178 L445 237 L340 204 Q170 240 40 200" stroke="#17374c"/><path d="M535 200 Q650 110 805 175 Q870 188 945 237 Q855 214 805 211 Q665 240 535 200" stroke="#167b82"/><path d="M340 178 L340 204" stroke="#df7b22"/><path d="M680 183 Q765 170 830 205 M705 215 L725 183 L750 215 L775 183 L800 215" stroke="#df7b22" stroke-width="3"/></g><circle cx="340" cy="191" r="7" fill="#df7b22"/><g font-family="sans-serif" font-size="18" fill="#17374c"><text x="40" y="290">Rotation concentrated at a hinge</text><text x="535" y="290">Strain distributed through selected members</text><text x="40" y="350">Primary loads still need a stiff path to the wing root.</text><text x="40" y="385">Conceptual schematic • not ETH geometry or aerodynamic results</text></g></svg>
