<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Primary flight controls and the three aircraft rotations</title><desc id="desc">Three aircraft views show elevator for pitch, differential ailerons for roll and rudder for yaw.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#196b95"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#17324d"><text x="40" y="48" font-size="31" font-weight="bold">Primary controls change aerodynamic loading and command moments</text><text x="40" y="80" font-size="18">Conventional airplane layout · schematic views · control deflections and force directions are illustrative</text><g transform="translate(35 120)"><rect width="350" height="500" rx="16" fill="#f5f8fa" stroke="#9db2bf" stroke-width="2"/><text x="22" y="38" font-size="24" font-weight="bold">Pitch — elevator / stabilator</text><path d="M52 235 L210 210 L294 225 L210 243 Z" fill="#cfdde5" stroke="#17324d" stroke-width="3"/><path d="M92 225 L130 116 L163 120 L151 229 Z" fill="#cfdde5" stroke="#17324d" stroke-width="3"/><path d="M65 243 L115 340 L152 336 L133 243 Z" fill="#cfdde5" stroke="#17324d" stroke-width="3"/><path d="M55 235 L145 263 L212 251 L212 235 Z" fill="#f08a3b" stroke="#a64d13" stroke-width="3"/><circle cx="175" cy="235" r="8" fill="#c73338"/><text x="184" y="228" font-size="16">CG</text><path d="M132 250 L132 312" stroke="#196b95" stroke-width="4" marker-end="url(#arrow)"/><text x="35" y="385" font-size="18">Elevator changes tail force</text><path d="M265 270 A95 95 0 0 0 248 185" fill="none" stroke="#196b95" stroke-width="4" marker-end="url(#arrow)"/><text x="199" y="165" font-size="18">pitch moment</text><text x="22" y="445" font-size="17">Body y-axis: wingtip to wingtip</text><text x="22" y="474" font-size="17">Angular-rate symbol: q</text></g><g transform="translate(425 120)"><rect width="350" height="500" rx="16" fill="#f5f8fa" stroke="#9db2bf" stroke-width="2"/><text x="22" y="38" font-size="24" font-weight="bold">Roll — differential ailerons</text><path d="M175 80 L206 200 L322 275 L206 288 L175 428 L144 288 L28 275 L144 200 Z" fill="#cfdde5" stroke="#17324d" stroke-width="3"/><path d="M38 270 L125 276 L125 302 L40 295 Z" fill="#f08a3b" stroke="#a64d13" stroke-width="3"/><path d="M225 276 L312 270 L310 295 L225 302 Z" fill="#f08a3b" stroke="#a64d13" stroke-width="3"/><circle cx="175" cy="255" r="8" fill="#c73338"/><text x="184" y="247" font-size="16">CG</text><path d="M83 258V195" stroke="#196b95" stroke-width="4" marker-end="url(#arrow)"/><path d="M269 312V375" stroke="#196b95" stroke-width="4" marker-end="url(#arrow)"/><text x="37" y="160" font-size="17">ΔL left</text><text x="246" y="400" font-size="17">ΔL right</text><path d="M170 460 A70 34 0 0 1 239 480" fill="none" stroke="#196b95" stroke-width="4" marker-end="url(#arrow)"/><text x="112" y="492" font-size="18">rolling moment</text><text x="22" y="445" font-size="17">Body x-axis: nose to tail</text><text x="22" y="474" font-size="17">Angular-rate symbol: p</text></g><g transform="translate(815 120)"><rect width="350" height="500" rx="16" fill="#f5f8fa" stroke="#9db2bf" stroke-width="2"/><text x="22" y="38" font-size="24" font-weight="bold">Yaw — rudder</text><path d="M175 112 L217 198 L273 255 L217 314 L175 405 L133 314 L78 255 L133 198 Z" fill="#cfdde5" stroke="#17324d" stroke-width="3"/><path d="M168 112 L183 112 L205 173 L180 182 Z" fill="#f08a3b" stroke="#a64d13" stroke-width="3"/><circle cx="175" cy="255" r="8" fill="#c73338"/><text x="184" y="247" font-size="16">CG</text><path d="M200 151H278" stroke="#196b95" stroke-width="4" marker-end="url(#arrow)"/><text x="218" y="139" font-size="17">ΔY on fin</text><path d="M248 327 A100 100 0 0 0 290 229" fill="none" stroke="#196b95" stroke-width="4" marker-end="url(#arrow)"/><text x="197" y="365" font-size="18">yawing moment</text><text x="22" y="445" font-size="17">Body z-axis: normal to plan view</text><text x="22" y="474" font-size="17">Angular-rate symbol: r</text></g><text x="40" y="675" font-size="18">Ailerons usually move differentially. Control authority depends on airspeed, configuration and design; a rudder input alone does not make a coordinated turn.</text></g></svg>
