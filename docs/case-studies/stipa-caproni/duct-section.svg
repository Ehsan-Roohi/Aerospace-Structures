<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Conceptual duct shell and frame cross-section</title><desc id="d">An annular duct with inner and outer plywood skins, frames, longitudinal load path, engine support and pressure arrows.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17617c"/></marker></defs><rect width="1100" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#172c3e"><text x="36" y="42" font-size="28" font-weight="bold">A shell-and-frame interpretation of the duct</text><text x="36" y="72" font-size="18">Cross-section concept · not to scale · functions, not historical dimensions</text><circle cx="470" cy="330" r="190" fill="#dfeaec" stroke="#29485b" stroke-width="4"/><circle cx="470" cy="330" r="128" fill="white" stroke="#29485b" stroke-width="4"/><g fill="none" stroke="#b36a25" stroke-width="10"><path d="M470 140V188"/><path d="M660 330H610"/><path d="M470 520V472"/><path d="M280 330H330"/></g><g stroke="#17617c" stroke-width="3" marker-end="url(#a)"><path d="M470 100V180"/><path d="M705 330H620"/><path d="M470 560V480"/><path d="M235 330H320"/><path d="M470 330H585"/></g><text x="490" y="119" font-size="18">Outer pressure</text><text x="714" y="316" font-size="18">Inner pressure</text><text x="490" y="584" font-size="18">Outer pressure</text><rect x="422" y="290" width="96" height="80" rx="8" fill="#f3e5d8" stroke="#8d4b18" stroke-width="3"/><text x="438" y="322" font-size="17">engine</text><text x="429" y="347" font-size="17">support</text><g stroke="#8d4b18" stroke-width="4"><path d="M422 300L358 242"/><path d="M518 300L582 242"/><path d="M422 360L358 418"/><path d="M518 360L582 418"/></g><text x="745" y="175" font-size="21" font-weight="bold">Structural functions</text><text x="745" y="215" font-size="18">1. Inner skin: aerodynamic surface</text><text x="745" y="247" font-size="18">2. Outer skin: aerodynamic surface</text><text x="745" y="279" font-size="18">3. Frames: retain section shape</text><text x="745" y="311" font-size="18">4. Skin + longitudinal members:</text><text x="765" y="339" font-size="18">transfer loads between frames</text><text x="745" y="389" font-size="18">5. Mount forces enter framework,</text><text x="765" y="417" font-size="18">then spread through shell/frame</text><text x="36" y="582" font-size="17">Local checks: panel bending · skin buckling · frame ovalization · joints · cutout reinforcement</text></g></svg>
