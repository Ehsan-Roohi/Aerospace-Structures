<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Wing lift, drag and turning-load concepts</title><desc id="desc">A schematic bird in gliding flight shows lift normal to relative wind, drag opposite flight, weight downward; a second sketch shows the load factor and bank angle for a level turn.</desc><rect width="1000" height="420" fill="#f6f9fc"/><line x1="500" y1="30" x2="500" y2="390" stroke="#a7b9c8" stroke-dasharray="7 8" stroke-width="2"/><g stroke-width="5" fill="none"><path d="M55 324L435 217" stroke="#4b7798" stroke-dasharray="8 8"/><path d="M250 270L250 90" stroke="#2c9168"/><path d="M250 270L159 270" stroke="#d6614c"/><path d="M250 270L250 390" stroke="#d4a13d"/></g><g fill="#24394e"><path d="M205 255L155 237L195 242L231 227L248 243L288 245L334 225L292 258L250 251L231 265Z"/><path d="M178 234L169 213L181 227Z" opacity=".6"/></g><g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1c405b"><text x="48" y="40" font-size="25" font-weight="700">Gliding force balance</text><text x="264" y="101" fill="#2c9168">Lift L</text><text x="78" y="255" fill="#d6614c">Drag D</text><text x="264" y="382" fill="#ad8026">Weight W = mg</text><text x="63" y="362" font-size="17">Relative air-path direction</text></g><g transform="translate(735 226) rotate(-27)"><path d="M-169 0L-40 -25L0 -12L55 -25L169 0L55 22L0 14L-40 22Z" fill="#28475f"/><path d="M-154 -4L-125 -15M-154 1L-125 9M154 -4L125 -15M154 1L125 9" stroke="#cfe0e8" stroke-width="3"/><path d="M0 10L0 50L-16 64L10 64L15 50Z" fill="#28475f"/></g><path d="M735 245L735 85" stroke="#2c9168" stroke-width="5"/><path d="M735 245L735 368" stroke="#d4a13d" stroke-width="5"/><path d="M737 85l-9 15h18z" fill="#2c9168"/><path d="M735 368l-9-15h18z" fill="#d4a13d"/><path d="M735 245l73-136" stroke="#2c9168" stroke-width="5"/><path d="M808 109l-16 6 14 8z" fill="#2c9168"/><path d="M734 178A67 67 0 0 1 765 187" fill="none" stroke="#a25ead" stroke-width="3"/><g font-family="Arial, Helvetica, sans-serif" fill="#1c405b"><text x="541" y="41" font-size="25" font-weight="700">Banked turn: simplified</text><text x="816" y="105" font-size="21" fill="#2c9168">L tilted</text><text x="747" y="361" font-size="20" fill="#ad8026">W</text><text x="771" y="187" font-size="21" fill="#a25ead">φ</text><text x="534" y="378" font-size="21">n = 1/cos φ (level turn)</text><text x="535" y="405" font-size="16">Actual thermal circling may be unsteady.</text></g></svg>