<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
<title id="title">Electrical power, shaft power and heat</title><desc id="desc">Generic five-stage propulsion chain with losses; not CE-25A wiring</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b87"/></marker></defs>
<rect width="100%" height="100%" fill="#f2f6f9"/><g font-family="Arial,sans-serif" fill="#193449">
<text x="30" y="42" font-size="28" text-anchor="start" font-weight="bold" fill="#193449">From stored energy to thrust</text>
<text x="30" y="73" font-size="17" text-anchor="start" font-weight="normal" fill="#193449">Generic architecture; protection and electrical segregation are design-specific</text>
<rect x="30" y="145" width="180" height="100" rx="12" fill="#fff" stroke="#a1b7c6" stroke-width="2"/>
<text x="120.0" y="188.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#193449">Battery</text>
<text x="120.0" y="213.5" font-size="18" text-anchor="middle" font-weight="normal" fill="#193449">DC energy</text>
<rect x="240" y="145" width="180" height="100" rx="12" fill="#fff" stroke="#a1b7c6" stroke-width="2"/>
<text x="330.0" y="188.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#193449">Protection</text>
<text x="330.0" y="213.5" font-size="18" text-anchor="middle" font-weight="normal" fill="#193449">DC distribution</text>
<rect x="450" y="145" width="180" height="100" rx="12" fill="#fff" stroke="#a1b7c6" stroke-width="2"/>
<text x="540.0" y="188.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#193449">Inverter</text>
<text x="540.0" y="213.5" font-size="18" text-anchor="middle" font-weight="normal" fill="#193449">Controlled AC</text>
<rect x="660" y="145" width="180" height="100" rx="12" fill="#fff" stroke="#a1b7c6" stroke-width="2"/>
<text x="750.0" y="188.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#193449">Motor</text>
<text x="750.0" y="213.5" font-size="18" text-anchor="middle" font-weight="normal" fill="#193449">Shaft torque</text>
<rect x="870" y="145" width="180" height="100" rx="12" fill="#fff" stroke="#a1b7c6" stroke-width="2"/>
<text x="960.0" y="188.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#193449">Ducted fan</text>
<text x="960.0" y="213.5" font-size="18" text-anchor="middle" font-weight="normal" fill="#193449">Thrust</text>
<path d="M210 195L237 195" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M420 195L447 195" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M630 195L657 195" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M840 195L867 195" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M120 245L120 320" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M540 245L540 320" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M750 245L750 320" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="300" y="345" width="480" height="65" rx="12" fill="#e4f0f1" stroke="#a1b7c6" stroke-width="2"/>
<text x="540.0" y="383.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#193449">Heat → cooling system → surrounding air</text>
<path d="M120 320L540 320" stroke="#176b87" stroke-width="3" fill="none"/>
<path d="M750 320L540 320" stroke="#176b87" stroke-width="3" fill="none"/>
<path d="M540 320L540 340" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="30" y="440" font-size="18" text-anchor="start" font-weight="normal" fill="#193449">Motor efficiency, fan propulsive efficiency and complete-system efficiency are different.</text>
