<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b42318"/></marker><style>text{font-family:Arial,sans-serif;fill:#172b4d}.t{font-size:30px;font-weight:bold}.s{font-size:22px}.m{stroke:#b42318;stroke-width:5;marker-end:url(#a);fill:none}</style></defs><rect width="1250" height="560" fill="white"/><text x="625" y="48" text-anchor="middle" class="t">A stabilator moves as one surface; its antiservo tab adds resisting hinge moment</text>
