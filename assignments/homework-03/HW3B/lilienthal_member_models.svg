<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">From a Lilienthal inspired wing load path to three alternative member fixtures</title>
<desc id="desc">A conceptual right half wing transfers a prescribed downward load increment to an isolated member. Three different physical fixtures compare one clamped end, two simple supports, and two clamps. They are not historical attachment claims.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8a237f"/></marker></defs>
<rect width="1100" height="610" fill="white"/>
<g font-family="Arial,sans-serif" fill="#18334d">
<text x="35" y="35" font-size="23" font-weight="bold">One wing load path, three alternative connection models</text>
<text x="35" y="65" font-size="17">Conceptual teaching geometry — not a reconstruction of Lilienthal's wing</text>
<path d="M160 110L950 145L950 240L160 280Z" fill="#ecf3f5" stroke="#537487" stroke-width="3"/>
<g stroke="#a1b6bf" stroke-width="2"><path d="M300 117V273M460 124V265M620 131V257M780 138V249"/></g>
<path d="M160 195H950" stroke="#bd482b" stroke-width="8"/>
<path d="M555 98V185" stroke="#8a237f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="575" y="105" font-size="17">Prescribed control-load increment</text>
<text x="575" y="128" font-size="17">P = 3 N downward at midspan</text>
<text x="35" y="192" font-size="17">Root-side</text><text x="35" y="215" font-size="17">connection</text>
<text x="310" y="308" font-size="18">Isolated scaled member: span x = s, L = 450 mm</text>
<text x="35" y="350" font-size="19" font-weight="bold">Physical fixtures below show supports and applied force only — draw their free bodies separately.</text>
<g stroke="#18334d" stroke-width="5"><path d="M75 435H315M425 435H665M775 435H1015"/></g>
<g fill="#d8eadd" stroke="#277447" stroke-width="3"><rect x="62" y="410" width="13" height="50"/><path d="M425 440L409 465H441ZM665 440L649 465H681Z"/><rect x="762" y="410" width="13" height="50"/><rect x="1015" y="410" width="13" height="50"/></g>
<g fill="white" stroke="#277447" stroke-width="2"><circle cx="655" cy="471" r="4"/><circle cx="675" cy="471" r="4"/></g>
<g stroke="#8a237f" stroke-width="3" marker-end="url(#arrow)"><path d="M195 377V428M545 377V428M895 377V428"/></g>
<g font-size="17"><text x="115" y="493">A · Cantilever fixture</text><text x="425" y="493">B · Pin–roller fixture</text><text x="815" y="493">C · Fixed–fixed fixture</text>
<text x="75" y="520">Root held; far end free</text><text x="410" y="520">Both end heights restrained</text><text x="770" y="520">Both end heights restrained</text>
<text x="75" y="543">Root rotation restrained</text><text x="410" y="543">End rotations free</text><text x="770" y="543">Both end rotations restrained</text></g>
<text x="35" y="588" font-size="17" font-weight="bold">Same member and load; different fixtures. A free aircraft wing tip is not a second clamp.</text>
</g></svg>
