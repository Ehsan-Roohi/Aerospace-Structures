<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img"><title>Equivalent capture load path</title><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#087f8c"/></marker></defs><rect width="1000" height="480" fill="#f4f8fc"/><g font-family="Arial,sans-serif" fill="#142c44"><text x="35" y="42" font-size="25" font-weight="bold">Equivalent capture load path</text><rect x="100" y="95" width="95" height="290" fill="#afc2d3" stroke="#142c44"/><path d="M100 95L195 190L100 285L195 385M195 95L100 190L195 285L100 385" fill="none" stroke="#142c44" stroke-width="2"/><path d="M195 230H490" stroke="#087f8c" stroke-width="20"/><rect x="430" y="85" width="95" height="140" rx="30" fill="#ddd" stroke="#142c44" stroke-width="3"/><path d="M477 150V220" stroke="#cc5c21" stroke-width="5" marker-end="url(#arr)"/><text x="545" y="120" font-size="19">Vehicle mass / reinforced interfaces</text><text x="545" y="175" font-size="19">Reaction R → receiving arm</text><text x="250" y="285" font-size="19">Equivalent reach L</text><text x="250" y="325" font-size="19">Root bending: M = R L</text><rect x="65" y="385" width="170" height="30" fill="#697c8b"/><text x="270" y="405" font-size="19">Tower → foundation → ground</text><text x="35" y="450" font-size="15">One-arm equivalent shown; actual contact hardware and bracing are not specified.</text></g></svg>