<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">From a surface load to a member load</title><desc id="d">A roof strip of width s contributes w = q s to one idealized beam.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b46e36"/></marker></defs><rect width="1000" height="560" fill="#f4f5f1"/><g font-family="Arial, sans-serif" fill="#1d3845"><text x="42" y="53" font-size="28" font-weight="700">From a surface load to a member load</text><text x="42" y="88" font-size="17" fill="#536a72">A roof strip of width s contributes w = q s to one idealized beam.</text><path d="M130 170L750 170L870 370L250 370Z" fill="#e0e8e4" stroke="#567479" stroke-width="3"/><path d="M330 170L450 370L610 370L490 170Z" fill="#c2d3be" stroke="#50704f" stroke-width="3"/><path d="M410 170L530 370" stroke="#1d3845" stroke-width="9"/><path d="M450 405H610M450 395V415M610 395V415" stroke="#b46e36" stroke-width="3"/><text x="510" y="440" font-size="24">s</text><text x="670" y="235" font-size="22">q [N/m²]</text><text x="650" y="280" font-size="22">w [N/m]</text><text x="135" y="485" font-size="21">Check units: 0.15 kPa × 3 m = 450 N/m</text></g><text x="42" y="535" fill="#63777a" font-family="Arial,sans-serif" font-size="15">Original teaching diagram · conceptual geometry, not a reconstruction of Plant 2</text></svg>