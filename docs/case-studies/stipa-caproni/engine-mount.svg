<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="t d"><title id="t">Generic engine mount free body diagram</title><desc id="d">Engine suspended between mount nodes with thrust, weight and torque reactions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17617c"/></marker></defs><rect width="1100" height="570" fill="white"/><g font-family="Arial,sans-serif" fill="#172c3e"><text x="35" y="42" font-size="28" font-weight="bold">The engine mount carries force and moment together</text><text x="35" y="72" font-size="18">Generic free-body diagram · not a historical mount drawing</text><path d="M155 150H650V425H155Z" fill="#edf3f6" stroke="#29485b" stroke-width="4"/><rect x="300" y="235" width="210" height="115" rx="15" fill="#f3e5d8" stroke="#8d4b18" stroke-width="4"/><text x="350" y="283" font-size="25">ENGINE</text><text x="335" y="315" font-size="18">and propeller shaft</text><g stroke="#8d4b18" stroke-width="6"><path d="M300 250L190 185"/><path d="M510 250L615 185"/><path d="M300 335L190 395"/><path d="M510 335L615 395"/></g><g stroke="#17617c" stroke-width="4" marker-end="url(#a)"><path d="M405 235V145"/><path d="M405 350V440"/><path d="M510 292H640"/></g><text x="417" y="180" font-size="20">Mount reaction</text><text x="417" y="465" font-size="20">Engine weight Wₑ</text><text x="524" y="278" font-size="20">Thrust T</text><path d="M300 390 A110 85 0 0 0 480 420" fill="none" stroke="#b36a25" stroke-width="5" marker-end="url(#a)"/><text x="370" y="452" font-size="20" fill="#8d4b18">reaction torque Q</text><text x="740" y="170" font-size="21" font-weight="bold">What must be checked?</text><text x="740" y="215" font-size="18">• Axial force in mount members</text><text x="740" y="250" font-size="18">• Force couple resisting torque</text><text x="740" y="285" font-size="18">• Engine alignment and clearance</text><text x="740" y="320" font-size="18">• Vibration / fatigue at joints</text><text x="740" y="355" font-size="18">• Transfer into shell + frames</text><text x="35" y="525" font-size="17">Power P and angular speed Ω set nominal shaft torque: Q = P / Ω. Dynamic loads require more than this static model.</text></g></svg>
