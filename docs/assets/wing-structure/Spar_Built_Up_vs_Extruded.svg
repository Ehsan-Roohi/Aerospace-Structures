<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1090" viewBox="0 0 1800 1090" role="img"><title>From riveted sheets to extruded spar caps</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#19364b"/></marker></defs><rect width="1800" height="1090" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="70" font-size="43" text-anchor="start" fill="#19364b">From riveted sheets to extruded spar caps</text><text x="65" y="118" font-size="27" text-anchor="start" fill="#19364b">End views: span runs into / out of the page. Schematics, not original manufacturing drawings.</text><text x="70" y="195" font-size="35" text-anchor="start" fill="#19364b">7-Shi (1932): built-up sheet spar</text><text x="960" y="195" font-size="35" text-anchor="start" fill="#19364b">9-Shi / A5M and later Zero</text><text x="70" y="240" font-size="27" text-anchor="start" fill="#19364b">Large suitable extrusions were not readily available.</text><text x="960" y="240" font-size="27" text-anchor="start" fill="#19364b">Extruded caps + a separate sheet web</text><rect x="338" y="337" width="24" height="350" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><rect x="320" y="325" width="16" height="120" fill="#17749d" stroke="#19364b" stroke-width="3"/><rect x="364" y="325" width="16" height="120" fill="#17749d" stroke="#19364b" stroke-width="3"/><rect x="230" y="303" width="260" height="14" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><rect x="245" y="319" width="230" height="14" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><rect x="262" y="335" width="196" height="14" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><rect x="320" y="568" width="16" height="120" fill="#17749d" stroke="#19364b" stroke-width="3"/><rect x="364" y="568" width="16" height="120" fill="#17749d" stroke="#19364b" stroke-width="3"/><rect x="262" y="684" width="196" height="14" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><rect x="245" y="700" width="230" height="14" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><rect x="230" y="716" width="260" height="14" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><circle cx="350" cy="365" r="8" fill="#ba641e"/><circle cx="350" cy="402" r="8" fill="#ba641e"/><circle cx="350" cy="605" r="8" fill="#ba641e"/><circle cx="350" cy="648" r="8" fill="#ba641e"/><text x="70" y="300" font-size="27" text-anchor="start" fill="#19364b">Built-up upper cap</text><path d="M270,309 L300,325" fill="none" stroke="#19364b" stroke-width="4" /><text x="70" y="470" font-size="28" text-anchor="start" fill="#19364b">Sheet web</text><path d="M245,464 L338,500" fill="none" stroke="#19364b" stroke-width="4" /><text x="70" y="540" font-size="28" text-anchor="start" fill="#19364b">Riveted joints</text><path d="M263,535 L345,403" fill="none" stroke="#19364b" stroke-width="4" /><text x="70" y="795" font-size="27" text-anchor="start" fill="#19364b">Sheets / angles are formed, stacked and riveted.</text><text x="70" y="837" font-size="26" text-anchor="start" fill="#19364b">Exact 7-Shi section shape is not reconstructed here.</text><rect x="1298" y="337" width="20" height="350" fill="#e4f0f5" stroke="#19364b" stroke-width="3"/><polygon points="1190,303 1426,303 1426,337 1328,337 1328,442 1288,442 1288,337 1190,337" fill="#17749d" stroke="#19364b" stroke-width="3"/><polygon points="1190,730 1426,730 1426,696 1328,696 1328,592 1288,592 1288,696 1190,696" fill="#17749d" stroke="#19364b" stroke-width="3"/><circle cx="1308" cy="366" r="8" fill="#ba641e"/><circle cx="1308" cy="404" r="8" fill="#ba641e"/><circle cx="1308" cy="628" r="8" fill="#ba641e"/><circle cx="1308" cy="666" r="8" fill="#ba641e"/><text x="1470" y="325" font-size="28" text-anchor="start" fill="#19364b">Upper cap</text><path d="M1450,332 L1400,322" fill="none" stroke="#19364b" stroke-width="4" /><text x="1470" y="500" font-size="28" text-anchor="start" fill="#19364b">Sheet web</text><path d="M1440,496 L1318,506" fill="none" stroke="#19364b" stroke-width="4" /><text x="1470" y="700" font-size="28" text-anchor="start" fill="#19364b">Lower cap</text><path d="M1450,705 L1400,713" fill="none" stroke="#19364b" stroke-width="4" /><text x="960" y="795" font-size="27" text-anchor="start" fill="#19364b">Zero example: T-shaped ESD caps; sheet web.</text><text x="960" y="837" font-size="27" text-anchor="start" fill="#19364b">The entire spar was NOT one extruded piece.</text><path d="M895,165 L895,860" fill="none" stroke="#a4b8c5" stroke-width="4" /><rect x="65" y="900" width="1670" height="150" fill="#f3f7f9" stroke="#a4b8c5" stroke-width="3"/><text x="95" y="944" font-size="30" text-anchor="start" fill="#19364b">CAPS: mainly carry bending tension / compression.  WEB: mainly carries shear.</text><text x="95" y="991" font-size="29" text-anchor="start" fill="#19364b">9-Shi introduced the manufacturing advance; Zero added a stronger cap alloy (ESD).</text><text x="95" y="1031" font-size="26" text-anchor="start" fill="#19364b">Construction and material are two different design choices. Dimensions omitted.</text></g></svg>