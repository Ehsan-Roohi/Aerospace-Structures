<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Strength and stability are different constraints</title><desc id="d">A slender support may buckle before reaching the material yield stress.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b46e36"/></marker></defs><rect width="1000" height="560" fill="#f4f5f1"/><g font-family="Arial, sans-serif" fill="#1d3845"><text x="42" y="53" font-size="28" font-weight="700">Strength and stability are different constraints</text><text x="42" y="88" font-size="17" fill="#536a72">A slender support may buckle before reaching the material yield stress.</text><path d="M230 160V420M650 160Q765 285 650 420" fill="none" stroke="#24424f" stroke-width="12"/><path d="M230 110V150M650 110V150" stroke="#b46e36" stroke-width="5" marker-end="url(#arrow)"/><path d="M200 425H265M620 425H685" stroke="#24424f" stroke-width="7"/><text x="160" y="475" font-size="21">straight ideal member</text><text x="550" y="475" font-size="21">buckled configuration</text><text x="340" y="260" font-size="24">Pcr = π² E Imin / (K L)²</text><text x="340" y="305" font-size="18">boundary conditions and bracing matter</text><text x="340" y="340" font-size="18">imperfections reduce real performance</text></g><text x="42" y="535" fill="#63777a" font-family="Arial,sans-serif" font-size="15">Original teaching diagram · conceptual geometry, not a reconstruction of Plant 2</text></svg>