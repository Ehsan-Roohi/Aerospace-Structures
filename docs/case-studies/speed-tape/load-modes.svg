<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Tension shear and peel</title><desc id="desc">Foil tension ruptures a strip, shear transfers a tangential force through a bond, peel separates a raised edge.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b12c78"/></marker></defs><rect width="900" height="390" fill="#f4f8fb"/><g font-family="Arial,sans-serif" fill="#153047"><text x="30" y="40" font-size="25" font-weight="bold">Different tests are not interchangeable</text><g font-size="22" font-weight="bold"><text x="45" y="95">Foil tension</text><text x="345" y="95">Bond shear</text><text x="650" y="95">Peel</text></g><g fill="#91a8b8"><rect x="90" y="175" width="135" height="18"/><rect x="345" y="160" width="200" height="20"/><rect x="380" y="195" width="200" height="20"/><rect x="650" y="195" width="200" height="35"/></g><rect x="380" y="181" width="165" height="13" fill="#e2ae49"/><path d="M650 184H745Q790 184 790 135V115" stroke="#91a8b8" stroke-width="15" fill="none"/><path d="M650 192H743" stroke="#e2ae49" stroke-width="7"/><g stroke="#b12c78" stroke-width="4" marker-end="url(#a)"><path d="M100 183H40"/><path d="M215 183H275"/><path d="M380 165H315"/><path d="M540 210H605"/><path d="M790 135V100"/></g><g font-size="18"><text x="45" y="285">Backing rupture</text><text x="345" y="285">Tangential transfer</text><text x="650" y="285">Opening front</text><text x="45" y="340">Catalogue N/cm values refer to specific tests, not aircraft design allowables.</text></g></g></svg>
