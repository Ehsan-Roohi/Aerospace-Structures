<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Wheel contact load path</title><desc id="d">Normal load passes downward through a wheel and a thin contaminated contact. A horizontal reaction provides traction.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#155a79"/></marker></defs><rect width="900" height="420" fill="#f0f6fa"/><circle cx="300" cy="170" r="125" fill="#d5dde4" stroke="#304c5d" stroke-width="5"/><circle cx="300" cy="170" r="15" fill="#304c5d"/><path d="M300 60 V140" stroke="#155a79" stroke-width="5" marker-end="url(#a)"/><text x="330" y="90" font-family="sans-serif" font-size="24">Normal load N</text><rect x="80" y="301" width="730" height="48" fill="#627e8e"/><rect x="240" y="294" width="120" height="7" fill="#392a21"/><path d="M300 289 H440" stroke="#155a79" stroke-width="5" marker-end="url(#a)"/><text x="465" y="285" font-family="sans-serif" font-size="24">Tangential reaction Fₜ</text><text x="420" y="365" font-family="sans-serif" font-size="20">Rail</text><text x="85" y="395" font-family="sans-serif" font-size="20">Thin third-body layer: greatly exaggerated thickness</text></svg>