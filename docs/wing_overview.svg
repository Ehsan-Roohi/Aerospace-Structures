<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Parts and dimensions of a semi-wing</title>
<desc id="desc">Illustrative top view of a tapered semi-wing with fixed root at left, tip at right, chordwise ribs and spanwise reinforcement. Root chord, tip chord and semi-span are labelled without prescribing dimensions.</desc>
<rect width="1200" height="390" rx="16" fill="#f3f6fa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="36" font-size="22" font-weight="700" fill="#193e65">Your semi-wing: main parts and dimensions</text>
<path d="M230 123L940 154L940 267L230 316Z" fill="#e3edf7" stroke="#466d91" stroke-width="3"/>
<g stroke="#ddab35" stroke-width="7" fill="none"><path d="M340 128L340 308M460 133L460 300M580 138L580 292M700 144L700 283M820 149L820 275"/></g>
<g stroke="#866bb2" stroke-width="6" fill="none"><path d="M230 174L940 183M230 253L940 232"/></g>
<path d="M230 123V316" fill="none" stroke="#217760" stroke-width="9"/>
<g stroke="#217760" stroke-width="2" fill="none"><path d="M230 137L212 149M230 162L212 174M230 187L212 199M230 212L212 224M230 237L212 249M230 262L212 274M230 287L212 299"/></g>
<g stroke="#52667a" stroke-width="1.6" fill="none"><path d="M230 78H940M230 69V105M940 69V135M167 123V316M156 123H206M156 316H206M1003 154V267M976 154H1014M976 267H1014"/></g>
<g fill="#193e65" font-size="18"><text x="491" y="69">Semi-span (root to tip)</text><text x="35" y="212">Root chord</text><text x="1020" y="215">Tip chord</text><text x="220" y="347">Fixed root</text><text x="911" y="299">Tip</text></g>
<g font-size="17"><text x="430" y="369" fill="#946d0b">Yellow: ribs</text><text x="625" y="369" fill="#705496">Purple: spanwise reinforcement</text></g>
</g></svg>
