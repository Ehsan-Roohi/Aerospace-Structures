<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
 <title id="title">Two routes through the atmosphere</title><desc id="desc">Compare the vehicles on return to Earth; neither architecture removes the heating problem.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#17788a"/></marker></defs>
 <rect width="1120" height="640" rx="16" fill="#eef5f8"/>
 <style>text{font-family:Arial,sans-serif;fill:#17394a}text[fill="white"]{fill:#fff}.title{font-size:30px;font-weight:bold}.sub{font-size:18px;fill:#496372}.label{font-size:22px;font-weight:bold}.small{font-size:18px}.box{fill:white;stroke:#b9cdd9;stroke-width:2}.arr{fill:none;stroke:#17788a;stroke-width:4;marker-end:url(#a)}</style>
 <text x="44" y="54" class="title">Two routes through the atmosphere</text><text x="44" y="87" class="sub">Compare the vehicles on return to Earth; neither architecture removes the heating problem.</text>
 <rect class="box" x="50" y="130" width="480" height="410" rx="14"/><rect class="box" x="590" y="130" width="480" height="410" rx="14"/>
<text x="80" y="176" class="label">Dream Chaser · LEO return</text><text x="80" y="224" class="small">Lifting-body entry and aerodynamic control</text><path class="arr" d="M290 242V285"/><text x="80" y="322" class="small">Reusable insulating TPS</text><path class="arr" d="M290 340V383"/><text x="80" y="422" class="small">Unpowered approach and runway landing</text><text x="80" y="490" class="small">Ground loads enter via landing supports.</text>
<text x="620" y="176" class="label">Orion · Lunar return</text><text x="620" y="224" class="small">Blunt capsule entry with lift modulation</text><path class="arr" d="M830 242V285"/><text x="620" y="322" class="small">Ablative Avcoat heat shield</text><path class="arr" d="M830 340V383"/><text x="620" y="422" class="small">Parachute descent and ocean splashdown</text><text x="620" y="490" class="small">Water impact loads enter through capsule.</text>
 <text x="44" y="610" class="sub">MIE 446 · Original teaching schematic · Geometry and thicknesses are not to scale</text></svg>